name: Backend

on:
  pull_request:
    paths:
      - backend/**
      - contracts/**
      - deploy/**
      - docker-compose.yml
      - .github/workflows/backend.yml
      - .github/actions/backend-stack/**
  push:
    branches: [main]
    paths:
      - backend/**
      - contracts/**
      - deploy/**
      - docker-compose.yml
      - .github/workflows/backend.yml
      - .github/actions/backend-stack/**
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  go:
    name: Lint, scan and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generated code is current
        run: make gen-check
      - name: Lint
        run: make lint
      - name: Vulnerabilities
        run: make vuln
      - name: Security analysis
        run: make sec
      - name: Tests (race detector, Postgres in containers)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  images:
    name: Image ${{ matrix.service }}
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, files, identity, itsm, system, db-roles]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/platform/${{ matrix.service }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            SERVICE=${{ matrix.service }}
            PACKAGE=${{ matrix.service == 'db-roles' && './tools/db-roles' || '' }}
            VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan the image
        working-directory: .
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.59.1
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed ${{ env.IMAGE }}:${{ github.sha }}
      - name: Push with SBOM and provenance
        if: env.PUSH == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            SERVICE=${{ matrix.service }}
            PACKAGE=${{ matrix.service == 'db-roles' && './tools/db-roles' || '' }}
            VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}
      - uses: sigstore/cosign-installer@v3
        if: env.PUSH == 'true'
      - name: Sign
        if: env.PUSH == 'true'
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/helm/platform
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.1
      - run: helm lint --strict .
      - name: Validate against Kubernetes schemas
        run: >
          helm template ci . |
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -

  stack:
    name: Local stack smoke test
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    env:
      POSTGRES_PASSWORD: disposable_ci_only
      VALKEY_PASSWORD: disposable_ci_only
      GRAFANA_ADMIN_PASSWORD: disposable_ci_only
      PGADMIN_DEFAULT_EMAIL: ci@example.com
      PGADMIN_DEFAULT_PASSWORD: disposable_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Start
        uses: ./.github/actions/backend-stack
      - name: Probe
        run: |
          curl -fsS http://127.0.0.1:9080/readyz
          curl -fsS http://127.0.0.1:9081/readyz
          curl -fsS http://127.0.0.1:9082/readyz
          curl -fsS http://127.0.0.1:9083/readyz
          curl -fsS http://127.0.0.1:9084/readyz
          docker compose exec -T itsm-worker /app healthcheck
          docker compose exec -T files-worker /app healthcheck
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/unknown)" = 404
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
