name: Platform quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: ishoot_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:disposable_ci_only@localhost:5432/ishoot_ci_test?schema=public
      JWT_SECRET: ci-only-test-secret-with-at-least-thirty-two-characters
      REVALIDATION_SECRET: ci-only-revalidation-secret
      RESEND_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema packages/database/prisma/schema.prisma
      - run: pnpm exec prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - run: pnpm lint
      - run: pnpm audit:unused && pnpm test:uploads
      - run: pnpm test:action-schemas && pnpm test:platform && pnpm test:audit-security
      - run: pnpm test:audit-db && pnpm test:followup-db && pnpm test:open-items-db
      - run: node scripts/check-website.cjs
      - run: pnpm db:bootstrap
        env:
          SUPER_ADMIN_EMAIL: bootstrap@example.invalid
          SUPER_ADMIN_PASSWORD: disposable-ci-bootstrap-password
      - run: pnpm build
      - run: pnpm type-check
