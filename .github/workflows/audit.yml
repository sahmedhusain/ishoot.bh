name: Audit & Architecture Guardrails

on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-guardrails:
    name: Full Audit & Repair Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # This is a multi-app repo with no root package-lock.json, so npm caching
          # must be told where each app's lockfile lives.
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/it/package-lock.json
            apps/web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
          # go.sum lives in backend/, not the repo root.
          cache-dependency-path: backend/go.sum

      - name: Install Monorepo & App Dependencies
        run: |
          # Root package.json has no dependencies (it only holds script shims),
          # so there is nothing to install there.
          npm --prefix apps/admin install
          npm --prefix apps/it install
          npm --prefix apps/web install

      - name: Pillar 1 – Seed & Preset Parity Verification
        env:
          SUPER_ADMIN_EMAIL: seed@example.test
          SUPER_ADMIN_PASSWORD: disposable-seed-password
        run: |
          # verify-seed-dates.js reads finance.invoice, so the database it inspects
          # has to exist first. This pillar previously ran before any infra was up
          # and failed with "Set DATABASE_DIRECT_URL or DATABASE_URL in .env".
          # env-tool init writes .env from .env.example and derives DATABASE_URL /
          # DATABASE_DIRECT_URL for the local stack (also needed by docker compose).
          node scripts/env-tool.cjs init
          ./run.sh db reset --demo all --yes
          node scripts/verify-seed-dates.js

      - name: Pillar 2 – Codebase & Directory Isolation Scan
        run: |
          npm run check:isolation

      - name: Pillar 3 – OpenAPI Generation & Spectral Lint
        run: |
          npm run gen:openapi
          npx @stoplight/spectral-cli lint docs/api/combined-openapi.yaml

      - name: Pillar 3 – API Contract Freshness Verification
        run: |
          npm run gen:contracts
          git diff --exit-code apps/web/contracts apps/admin/contracts apps/it/contracts

      - name: Pillar 4 – Monorepo Type Check (Web, Admin, IT)
        run: |
          npm run type-check

      - name: Start Platform Infrastructure & Services
        run: |
          docker compose up -d --wait
          ./scripts/check-health.sh

      - name: Pillar 3 – Newman API Contract Smoke Tests
        run: |
          node scripts/generate-postman-artifacts.cjs
          npx newman run docs/api/combined-openapi.postman_collection.json -e docs/api/gateway.env.json --bail
