name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Disposable values for CI only. Postgres credentials and DATABASE_URL come from .env generated by
# `node scripts/env-tool.cjs init` so Docker Compose, run.sh, and verification scripts always match.
env:
  NODE_VERSION: 22
  REVALIDATION_SECRET: ci-only-revalidation-secret
  MFA_ENCRYPTION_KEY: ci-only-mfa-key-with-at-least-thirty-two-chars
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
  RESEND_API_KEY: ""
  API_URL: http://127.0.0.1:8080
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  static:
    name: Lint, types and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/it/package-lock.json
            apps/web/package-lock.json
            apps/store/package-lock.json
      - name: Install dependencies per app
        run: |
          npm --prefix apps/admin ci
          npm --prefix apps/it ci
          npm --prefix apps/web ci
          npm --prefix apps/store ci
      - name: Lint
        run: |
          npm --prefix apps/admin run lint
          npm --prefix apps/it run lint
          npm --prefix apps/web run lint
          npm --prefix apps/store run lint
      - name: Type-check
        run: |
          npm --prefix apps/admin run type-check
          npm --prefix apps/it run type-check
          npm --prefix apps/web run type-check
          npm --prefix apps/store run type-check
      - name: Unit tests
        run: |
          npm --prefix apps/admin test
          npm --prefix apps/it test
          npm --prefix apps/web test
          npm --prefix apps/store test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-results
          path: tests/.results/
          if-no-files-found: ignore

  database:
    name: Go migrations, bootstrap and company profiles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/it/package-lock.json
            apps/web/package-lock.json
            apps/store/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install seeding dependencies and initialize the disposable stack
        run: |
          npm --prefix apps/admin ci
          node scripts/env-tool.cjs init
          docker compose --env-file .env up -d postgres --wait
      - name: Empty schema bootstraps cleanly and idempotently
        env:
          SUPER_ADMIN_EMAIL: seed@example.test
          SUPER_ADMIN_PASSWORD: disposable-seed-password
        run: |
          ./run.sh db reset --empty --yes
          ./run.sh db bootstrap
      - name: Migrate, seed and verify the ishoot company profile
        env:
          SUPER_ADMIN_EMAIL: seed@example.test
          SUPER_ADMIN_PASSWORD: disposable-seed-password
          SEED_VOLUME: "off"
        run: ./run.sh db reset --company ishoot --yes
      - name: Go backend tests
        run: make -C backend test
      - name: Every company profile migrates, seeds and passes its demo checks
        env:
          SUPER_ADMIN_EMAIL: seed@example.test
          SUPER_ADMIN_PASSWORD: disposable-seed-password
          SEED_VOLUME: "off"
        run: |
          for dir in seeds/*/; do
            [ -f "${dir}seed.sql" ] || continue
            profile="${dir%/}"
            profile="${profile##*/}"
            echo "::group::$profile"
            ./run.sh db seed "$profile"
            node scripts/verify-seed-dates.js
            echo "::endgroup::"
          done
      - name: Bootstrap a company profile repeatedly
        env:
          SUPER_ADMIN_EMAIL: bootstrap@example.test
          SUPER_ADMIN_PASSWORD: disposable-bootstrap-password
        run: |
          ./run.sh db reset --empty --yes
          ./run.sh db bootstrap
          ./run.sh db bootstrap

  e2e:
    name: End-to-end (admin, setup wizard, website, store, IT dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_SERVER_MODE: start
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/it/package-lock.json
            apps/web/package-lock.json
            apps/store/package-lock.json
      - name: Install dependencies per app
        run: |
          npm --prefix apps/admin ci
          npm --prefix apps/it ci
          npm --prefix apps/web ci
          npm --prefix apps/store ci
      - uses: ./.github/actions/backend-stack
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Seed E2E database (Zayed Group)
        run: ./run.sh db seed zayed-group
      - name: Production builds of the apps
        env:
          DATABASE_URL: postgresql://postgres:disposable_ci_only@localhost:5432/platform_e2e_test?sslmode=disable
          DIRECT_URL: postgresql://postgres:disposable_ci_only@localhost:5432/platform_e2e_test?sslmode=disable
          NEXT_DIST_DIR: .next-e2e
          NEXT_PUBLIC_WEB_URL: http://localhost:3013
          NEXT_PUBLIC_ADMIN_URL: http://localhost:3012
          WEB_URL: http://localhost:3013
          ADMIN_URL: http://localhost:3012
          ADMIN_PREVIEW_ORIGINS: http://localhost:3014
        run: |
          npm --prefix apps/admin run build
          npm --prefix apps/it run build
          npm --prefix apps/web run build
          npm --prefix apps/store run build
      - name: Install Chromium
        run: npm --prefix apps/admin exec -- playwright install --with-deps chromium
      - name: Playwright E2E Tests
        run: |
          npm --prefix apps/admin run test:e2e
          npm --prefix apps/it run test:e2e
          npm --prefix apps/web run test:e2e
          npm --prefix apps/store run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: apps/*/tests/.results/
          retention-days: 14
          if-no-files-found: ignore
