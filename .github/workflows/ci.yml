name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Disposable values for CI only. Every database is a throwaway *_test database on the job's own Postgres (from the
# compose stack, which also runs the backend services the apps call).
env:
  NODE_VERSION: 22
  DATABASE_URL: postgresql://postgres:disposable_ci_only@localhost:5432/postgres?schema=public
  DIRECT_URL: postgresql://postgres:disposable_ci_only@localhost:5432/postgres?schema=public
  REVALIDATION_SECRET: ci-only-revalidation-secret
  MFA_ENCRYPTION_KEY: ci-only-mfa-key-with-at-least-thirty-two-chars
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
  RESEND_API_KEY: ""
  # The compose stack (.github/actions/backend-stack) runs Postgres with these, and the backend gateway.
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: disposable_ci_only
  POSTGRES_DB: postgres
  API_URL: http://127.0.0.1:8080
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  static:
    name: Lint, types and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies per app
        run: |
          npm --prefix apps/admin install
          npm --prefix apps/it install
          npm --prefix apps/web install
      - name: Lint
        run: |
          npm --prefix apps/admin run lint
          npm --prefix apps/it run lint
          npm --prefix apps/web run lint
      - name: Type-check
        run: |
          npm --prefix apps/admin run type-check
          npm --prefix apps/it run type-check
          npm --prefix apps/web run type-check
      - name: Unit tests
        run: |
          npm --prefix apps/admin test
          npm --prefix apps/it test
          npm --prefix apps/web test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-results
          path: tests/.results/
          if-no-files-found: ignore

  database:
    name: Business rules on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema packages/database/prisma/schema.prisma
      - uses: ./.github/actions/backend-stack
      - name: Prepare a bare and a seeded database (full demo volume)
        run: |
          node tests/e2e/prepare-db.cjs bare platform_bare_test
          SEED_VOLUME=on node tests/e2e/prepare-db.cjs seeded platform_seeded_test
      - name: Seeded data satisfies every integrity rule
        run: pnpm db:check-integrity
        env:
          DATABASE_URL: postgresql://postgres:disposable_ci_only@localhost:5432/platform_seeded_test?schema=public
          DIRECT_URL: postgresql://postgres:disposable_ci_only@localhost:5432/platform_seeded_test?schema=public
      - name: Database checks
        run: pnpm test:checks:db
        env:
          CI: true
          CHECKS_BARE_DATABASE_URL: postgresql://postgres:disposable_ci_only@localhost:5432/platform_bare_test?schema=public
          CHECKS_SEEDED_DATABASE_URL: postgresql://postgres:disposable_ci_only@localhost:5432/platform_seeded_test?schema=public
      - name: Every company profile seeds and passes the integrity rules
        env:
          DATABASE_URL: postgresql://postgres:disposable_ci_only@localhost:5432/platform_profile_test?schema=public
          DIRECT_URL: postgresql://postgres:disposable_ci_only@localhost:5432/platform_profile_test?schema=public
          SUPER_ADMIN_EMAIL: seed@example.test
          SUPER_ADMIN_PASSWORD: disposable-seed-password
          SEED_VOLUME: "off"
        run: |
          for dir in company/profiles/*/; do
            profile="$(basename "$dir")"
            echo "::group::$profile"
            node tests/e2e/prepare-db.cjs bare platform_profile_test
            COMPANY_PROFILE=$profile pnpm db:seed
            pnpm db:check-integrity
            echo "::endgroup::"
          done
      - name: Bootstrap a new company from a profile
        env:
          DATABASE_URL: postgresql://postgres:disposable_ci_only@localhost:5432/platform_profile_test?schema=public
          DIRECT_URL: postgresql://postgres:disposable_ci_only@localhost:5432/platform_profile_test?schema=public
          COMPANY_PROFILE: demo
          SUPER_ADMIN_EMAIL: bootstrap@example.test
          SUPER_ADMIN_PASSWORD: disposable-bootstrap-password
        run: |
          node tests/e2e/prepare-db.cjs bare platform_profile_test
          pnpm db:bootstrap
          pnpm db:bootstrap # running it again must be harmless
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-results
          path: tests/.results/
          if-no-files-found: ignore

  e2e:
    name: End-to-end (admin, setup wizard, website, IT dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_SERVER_MODE: start
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies per app
        run: |
          npm --prefix apps/admin install
          npm --prefix apps/it install
          npm --prefix apps/web install
      - uses: ./.github/actions/backend-stack
      - name: Production builds of the apps
        env:
          DATABASE_URL: postgresql://postgres:disposable_ci_only@localhost:5432/platform_e2e_test?schema=public
          DIRECT_URL: postgresql://postgres:disposable_ci_only@localhost:5432/platform_e2e_test?schema=public
          NEXT_DIST_DIR: .next-e2e
          NEXT_PUBLIC_WEB_URL: http://localhost:3013
          NEXT_PUBLIC_ADMIN_URL: http://localhost:3012
          WEB_URL: http://localhost:3013
          ADMIN_URL: http://localhost:3012
          ADMIN_PREVIEW_ORIGINS: http://localhost:3014
        run: |
          npm --prefix apps/admin run build
          npm --prefix apps/it run build
          npm --prefix apps/web run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E Tests
        run: |
          npm --prefix apps/admin run test:e2e
          npm --prefix apps/it run test:e2e
          npm --prefix apps/web run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: tests/.results/
          retention-days: 14
          if-no-files-found: ignore
