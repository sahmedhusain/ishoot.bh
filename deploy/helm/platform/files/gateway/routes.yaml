# Gateway route table (see services/gateway/README.md). Each service adds its routes when it goes live.
# Upstream names map to URLs through GATEWAY_UPSTREAMS; limits apply per signed-in account, or per client IP.
# Request bodies are limited per route; HTTP_BODY_LIMIT is the ceiling no route can exceed.
defaultBodyLimit: 1M
rateLimits:
  default: { requests: 300, window: 1m }
  sensitive: { requests: 10, window: 1m }
  # Calls between the platform's own back ends: high, to absorb bursts such as seeding.
  services: { requests: 6000, window: 1m }
routes:
  # Files: called by the apps' back ends with their service tokens (docs/adr/0011), never by browsers.
  - name: files
    prefix: /v1/files/
    upstream: files
    realms: [service]
    rateLimit: services
    bodyLimit: 11M
