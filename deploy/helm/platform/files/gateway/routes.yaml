# Gateway route table (see services/gateway/README.md). Each service adds its routes when it goes live.
# Upstream names map to URLs through GATEWAY_UPSTREAMS; limits apply per signed-in account, or per client IP.
# Request bodies are limited per route; HTTP_BODY_LIMIT is the ceiling no route can exceed.
defaultBodyLimit: 1M
rateLimits:
  default: { requests: 300, window: 1m }
  sensitive: { requests: 10, window: 1m }
  # Calls between the platform's own back ends: high, to absorb bursts such as seeding.
  services: { requests: 6000, window: 1m }
routes:
  # Files: called by the apps' back ends with their service tokens (docs/adr/0011), never by browsers.
  - name: files
    prefix: /v1/files/
    upstream: files
    realms: [service]
    rateLimit: services
    bodyLimit: 11M
  # IT tickets raised by employees, through the admin app's back end (service tokens).
  - name: itsm-requests
    prefix: /v1/itsm/requests/
    upstream: itsm
    realms: [service]
    rateLimit: services
  # The IT desk: IT staff with their own IT-realm tokens (each request is checked live against identity).
  - name: itsm-desk
    prefix: /v1/itsm/desk/
    upstream: itsm
    realms: [it]
    rateLimit: default
  # Identity: apps sign people in with their service tokens; staff and IT manage their own access/factors with their
  # access tokens. Identity itself decides which credential each endpoint takes and limits attempts per account.
  - name: identity
    prefix: /v1/identity/
    upstream: identity
    realms: [service, staff, customer, it]
    rateLimit: services
  # System settings: the apps' back ends read them; IT staff manage them with their own tokens.
  - name: system
    prefix: /v1/system/
    upstream: system
    realms: [service, it]
    rateLimit: services
  # Notifications: the apps' back ends queue messages (service tokens); IT staff watch and retry them (IT tokens).
  # Attachments travel base64-encoded in the request.
  - name: notify
    prefix: /v1/notify/
    upstream: notify
    realms: [service, it]
    rateLimit: services
    bodyLimit: 11M
  # Live updates and statuses (ADR 0012): the apps' back ends open Server-Sent Events streams for their people and set
  # statuses with service tokens; IT staff use their own tokens. A stream is one long request.
  - name: realtime
    prefix: /v1/realtime/
    upstream: realtime
    realms: [service, it]
    rateLimit: services
  # The audit trail: IT staff with their own tokens (audit:read).
  - name: audit-desk
    prefix: /v1/audit/desk/
    upstream: audit
    realms: [it]
    rateLimit: default
  # CMS: public pages/articles/reviews/faqs/stats/snapshots read by web and apps; staff manage content.
  - name: cms
    prefix: /v1/cms/
    upstream: cms
    realms: [service, staff, customer, it]
    rateLimit: services
    bodyLimit: 5M
  # Sales: CRM contacts, deals, inquiries, quotations, campaigns.
  - name: sales
    prefix: /v1/sales/
    upstream: sales
    realms: [service, staff, it]
    rateLimit: services
    bodyLimit: 5M
  # Finance: Invoices, payments, expenses, expense categories, settlements.
  - name: finance
    prefix: /v1/finance/
    upstream: finance
    realms: [service, staff, it]
    rateLimit: services
    bodyLimit: 5M
  # Workflow: Approvals, digital signatures, letters, tasks, calendar.
  - name: workflow
    prefix: /v1/workflow/
    upstream: workflow
    realms: [service, staff, it]
    rateLimit: services
    bodyLimit: 5M
  # HR: Employees, departments, leave, attendance, payroll.
  - name: hr
    prefix: /v1/hr/
    upstream: hr
    realms: [service, staff, it]
    rateLimit: services
    bodyLimit: 5M
  # Inventory: Warehouses, products, variants, stock levels, movements, counts.
  - name: inventory
    prefix: /v1/inventory/
    upstream: inventory
    realms: [service, staff, it]
    rateLimit: services
    bodyLimit: 5M
  # Commerce: Orders, customers, coupons, store settings, retail POS.
  - name: commerce
    prefix: /v1/commerce/
    upstream: commerce
    realms: [service, staff, customer, it]
    rateLimit: services
    bodyLimit: 5M
  # Delivery: Zones, delivery slots, shipments, vehicles, route sheets, proof of delivery.
  - name: delivery
    prefix: /v1/delivery/
    upstream: delivery
    realms: [service, staff, customer, it]
    rateLimit: services
    bodyLimit: 5M





