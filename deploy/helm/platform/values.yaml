# Defaults for every environment. Override per environment with values-<env>.yaml; never put secrets here.
global:
  image:
    registry: ghcr.io
    repository: example/platform # images are <registry>/<repository>/<service>:<tag>
    tag: "" # defaults to the chart appVersion
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  appEnv: production
  logLevel: info
  logFormat: json
  otelEndpoint: "" # e.g. http://otel-collector.observability:4318
  tracesSampleRatio: "0.1"
  # Name of a Secret (created by External Secrets or sealed-secrets) holding shared values such as REDIS_URL.
  sharedSecret: platform-shared
  # Secret holding service-keys.json: the public keys of the callers services trust (docs/adr/0011).
  serviceKeysSecret: platform-service-keys
  networkPolicy:
    enabled: true
    # Namespaces allowed to scrape the admin port (Prometheus) and reach the gateway (ingress controller).
    monitoringNamespace: observability
    ingressNamespace: ingress-nginx

ingress:
  enabled: true
  className: nginx
  host: api.example.com
  tlsSecret: api-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 25m

# Each service's own database login (backend/tools/db-roles), made before the migrations. Secret db-roles-secrets:
# DATABASE_URL (the database owner, direct) and DB_ROLE_PASSWORD_<SERVICE> for each service in DB_ROLES. Behind
# PgBouncer the login's statement timeout is the one that applies (DB_ROLE_STATEMENT_TIMEOUT_<SERVICE> overrides).
dbRoles:
  enabled: true
  env:
    DB_ROLES: files,identity,system,itsm,audit,notify
    DB_ROLE_STATEMENT_TIMEOUT: 15s
    DB_ROLE_IDLE_IN_TRANSACTION_TIMEOUT: 60s
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }

serviceMonitor:
  enabled: true
  interval: 30s

# One entry per service. `public: true` puts the service behind the ingress (only the gateway).
services:
  gateway:
    enabled: true
    public: true
    replicas: 2
    autoscaling:
      { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPU: 70 }
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { memory: 256Mi }
    env:
      GATEWAY_ROUTES_FILE: /config/routes.yaml
      GATEWAY_UPSTREAMS: "files=http://files:8080,itsm=http://itsm:8080,identity=http://identity:8080,system=http://system:8080,audit=http://audit:8080,notify=http://notify:8080"
      GATEWAY_IDENTITY_STATUS_URL: "http://identity:8080/v1/identity/session"
      HTTP_BODY_LIMIT: "11M"
      # Set AUTH_ISSUER to identity's public issuer (IDENTITY_ISSUER); keys are read inside the cluster.
      AUTH_ISSUER: ""
      AUTH_JWKS_URL: "http://identity:8080/.well-known/jwks.json"
      HTTP_TRUSTED_PROXIES: "10.0.0.0/8"
    # Files from the chart's files/<service>/ folder, mounted under /config. The same route table is used by
    # docker-compose.yml, so local and Kubernetes routing never differ.
    configFiles:
      - routes.yaml
    # Services the gateway may call (NetworkPolicy egress); filled in as services are added.
    talksTo: [files, itsm, identity, system]

  files:
    enabled: true
    public: false
    replicas: 2
    autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 8, targetCPU: 70 }
    # Runs `migrate` as a pre-install/pre-upgrade Job, and a separate `worker` Deployment for background jobs.
    migrate: true
    worker: { enabled: true, replicas: 1 }
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }
    env:
      HTTP_BODY_LIMIT: "11M"
      FILES_PUBLIC_BUCKET: public-assets
      FILES_PRIVATE_BUCKET: private-assets
      AUTH_SERVICE_KEYS_FILE: /keys/service-keys.json
    # Secrets (files-secrets): DATABASE_URL (svc_<service> through PgBouncer), DATABASE_DIRECT_URL (the same login, direct), S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY.
    configFiles: []
    talksTo: []

  itsm:
    enabled: true
    public: false
    replicas: 2
    autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPU: 70 }
    migrate: true
    # The SLA sweep; River makes concurrent sweeps safe, one replica is enough.
    worker: { enabled: true, replicas: 1 }
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
    env:
      AUTH_SERVICE_KEYS_FILE: /keys/service-keys.json
      AUTH_ISSUER: ""
      AUTH_JWKS_URL: "http://identity:8080/.well-known/jwks.json"
      ITSM_REQUEST_CALLERS: admin
    # Secrets (itsm-secrets): DATABASE_URL (svc_<service> through PgBouncer), DATABASE_DIRECT_URL (the same login, direct).
    configFiles: []
    talksTo: [identity]

  audit:
    enabled: true
    public: false
    replicas: 2
    autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4, targetCPU: 70 }
    migrate: true
    # Records every event from the EVENTS stream; the durable consumer shares the work between replicas.
    worker: { enabled: true, replicas: 1 }
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
    env:
      AUTH_SERVICE_KEYS_FILE: /keys/service-keys.json
      AUTH_ISSUER: ""
      AUTH_JWKS_URL: "http://identity:8080/.well-known/jwks.json"
      NATS_URL: nats://nats.nats:4222
      NATS_REPLICAS: "3"
    # Secrets (audit-secrets): DATABASE_URL (svc_<service> through PgBouncer), DATABASE_DIRECT_URL (the same login, direct).
    configFiles: []
    talksTo: [identity]

  notify:
    enabled: true
    public: false
    replicas: 2
    autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4, targetCPU: 70 }
    migrate: true
    # Delivers messages (River) and publishes notify's events.
    worker: { enabled: true, replicas: 2 }
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 384Mi }
    env:
      HTTP_BODY_LIMIT: "11M"
      AUTH_SERVICE_KEYS_FILE: /keys/service-keys.json
      AUTH_ISSUER: ""
      AUTH_JWKS_URL: "http://identity:8080/.well-known/jwks.json"
      NATS_URL: nats://nats.nats:4222
      NATS_REPLICAS: "3"
      NOTIFY_SYSTEM_URL: http://system:8080
      # E-mail through the Resend integration IT sets up; WhatsApp through the Cloud API with IT's credentials.
      NOTIFY_EMAIL_PROVIDER: integration
      NOTIFY_WHATSAPP_CREDENTIALS: integration
    # Secrets (notify-secrets): DATABASE_URL (svc_<service> through PgBouncer), DATABASE_DIRECT_URL (the same login, direct),
    # NOTIFY_SERVICE_KEY (its own service key, whose public half is in platform-service-keys).
    configFiles: []
    talksTo: [identity, system]

  identity:
    enabled: true
    public: false
    replicas: 2
    autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPU: 70 }
    migrate: true
    # Expired sessions and abandoned MFA enrollments.
    worker: { enabled: true, replicas: 1 }
    resources:
      # Argon2id needs memory per concurrent sign-in (IDENTITY_LOGIN_PASSWORD_MEMORY_KIB × MAX_CONCURRENT_KDF).
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }
    env:
      AUTH_SERVICE_KEYS_FILE: /keys/service-keys.json
      IDENTITY_ISSUER: ""
      IDENTITY_LOGIN_ENABLED: "true"
      IDENTITY_LOGIN_MFA_PRIMARY_ID: primary
      IDENTITY_CALLERS_STAFF: admin
      IDENTITY_CALLERS_CUSTOMER: web
      IDENTITY_CALLERS_IT: it
      NATS_URL: nats://nats.nats:4222
      NATS_REPLICAS: "3"
    # Secrets (identity-secrets): DATABASE_URL (svc_<service> through PgBouncer), DATABASE_DIRECT_URL (the same login, direct), IDENTITY_SIGNING_JWK, IDENTITY_LOGIN_REDIS_URL,
    # IDENTITY_LOGIN_RATE_KEY, IDENTITY_LOGIN_MFA_KEYS, IDENTITY_LOGIN_MFA_LEGACY_KEY.
    configFiles: []
    talksTo: []

  system:
    enabled: true
    public: false
    replicas: 2
    autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPU: 70 }
    # No background jobs yet, so no worker.
    migrate: true
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 192Mi }
    env:
      AUTH_SERVICE_KEYS_FILE: /keys/service-keys.json
      AUTH_ISSUER: ""
      AUTH_JWKS_URL: "http://identity:8080/.well-known/jwks.json"
      SYSTEM_READ_CALLERS: admin,web,it,notify
      SYSTEM_MODULE_WRITERS: admin
      SYSTEM_INTEGRATION_WRITERS: admin
      SYSTEM_DOMAIN_WRITERS: admin
      # The events broker: the official NATS chart with JetStream (3 replicas) in the "nats" namespace.
      NATS_URL: nats://nats.nats:4222
      NATS_REPLICAS: "3"
    # Secrets (system-secrets): DATABASE_URL (svc_<service> through PgBouncer), DATABASE_DIRECT_URL (the same login, direct), SECRETS_KEYS, SECRETS_PRIMARY_KEY_ID, SECRETS_LEGACY_INTEGRATION_KEY.
    configFiles: []
    talksTo: [identity]
