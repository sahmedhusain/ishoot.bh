# Defaults for every environment. Override per environment with values-<env>.yaml; never put secrets here.
global:
  image:
    registry: ghcr.io
    repository: example/platform # images are <registry>/<repository>/<service>:<tag>
    tag: "" # defaults to the chart appVersion
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  appEnv: production
  logLevel: info
  logFormat: json
  otelEndpoint: "" # e.g. http://otel-collector.observability:4318
  tracesSampleRatio: "0.1"
  # Name of a Secret (created by External Secrets or sealed-secrets) holding shared values such as REDIS_URL.
  sharedSecret: platform-shared
  # Secret holding service-keys.json: the public keys of the callers services trust (docs/adr/0011).
  serviceKeysSecret: platform-service-keys
  networkPolicy:
    enabled: true
    # Namespaces allowed to scrape the admin port (Prometheus) and reach the gateway (ingress controller).
    monitoringNamespace: observability
    ingressNamespace: ingress-nginx

ingress:
  enabled: true
  className: nginx
  host: api.example.com
  tlsSecret: api-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 25m

serviceMonitor:
  enabled: true
  interval: 30s

# One entry per service. `public: true` puts the service behind the ingress (only the gateway).
services:
  gateway:
    enabled: true
    public: true
    replicas: 2
    autoscaling:
      { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPU: 70 }
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { memory: 256Mi }
    env:
      GATEWAY_ROUTES_FILE: /config/routes.yaml
      GATEWAY_UPSTREAMS: "files=http://files:8080,itsm=http://itsm:8080"
      HTTP_BODY_LIMIT: "11M"
      AUTH_ISSUER: ""
      AUTH_JWKS_URL: ""
      HTTP_TRUSTED_PROXIES: "10.0.0.0/8"
    # Files from the chart's files/<service>/ folder, mounted under /config. The same route table is used by
    # docker-compose.yml, so local and Kubernetes routing never differ.
    configFiles:
      - routes.yaml
    # Services the gateway may call (NetworkPolicy egress); filled in as services are added.
    talksTo: [files, itsm]

  files:
    enabled: true
    public: false
    replicas: 2
    autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 8, targetCPU: 70 }
    # Runs `migrate` as a pre-install/pre-upgrade Job, and a separate `worker` Deployment for background jobs.
    migrate: true
    worker: { enabled: true, replicas: 1 }
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }
    env:
      HTTP_BODY_LIMIT: "11M"
      FILES_PUBLIC_BUCKET: public-assets
      FILES_PRIVATE_BUCKET: private-assets
      AUTH_SERVICE_KEYS_FILE: /keys/service-keys.json
    # Secrets (files-secrets): DATABASE_URL, S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY.
    configFiles: []
    talksTo: []

  itsm:
    enabled: true
    public: false
    replicas: 2
    autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPU: 70 }
    migrate: true
    # The SLA sweep; River makes concurrent sweeps safe, one replica is enough.
    worker: { enabled: true, replicas: 1 }
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
    env:
      AUTH_SERVICE_KEYS_FILE: /keys/service-keys.json
      AUTH_ISSUER: ""
      AUTH_JWKS_URL: ""
      ITSM_REQUEST_CALLERS: admin
    # Secrets (itsm-secrets): DATABASE_URL.
    configFiles: []
    talksTo: []
