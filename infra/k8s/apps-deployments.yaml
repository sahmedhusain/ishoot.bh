apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: platform-prod
  labels:
    app: web
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        tier: frontend
    spec:
      containers:
        - name: web
          image: ghcr.io/ishoot-bh/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: IT_INTERNAL_URL
              value: http://it.platform-prod.svc.cluster.local:3002
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: platform-prod
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
---
