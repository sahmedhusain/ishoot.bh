<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 110" width="280" height="110">
  <defs>
    <filter id="sig-ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8" />
    </filter>
  </defs>
  <g filter="url(#sig-ink)">
    <!-- Main Calligraphic Signature Strokes -->
    <!-- S Initial Loop and Flourish -->
    <path d="M 28,68 C 24,42 42,22 62,24 C 76,25 82,38 74,52 C 64,70 38,76 44,92 C 48,102 68,98 84,86 C 98,76 112,56 122,46"
          fill="none" stroke="#014842" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Middle Name Rhythm Strokes -->
    <path d="M 118,52 C 122,42 128,40 134,48 C 138,54 136,66 142,66 C 146,66 150,56 156,52 C 162,48 168,54 172,62 C 176,70 182,64 188,56 C 194,48 200,42 208,46 C 214,50 216,62 222,60"
          fill="none" stroke="#014842" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Terminal Flourish Loop -->
    <path d="M 218,58 C 230,42 248,34 256,44 C 262,52 254,66 240,74 C 220,86 190,92 160,94 C 110,97 60,94 36,90"
          fill="none" stroke="#014842" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dynamic Speed Underline & Finishing Dot -->
    <path d="M 52,94 C 95,90 175,88 238,91"
          fill="none" stroke="#09937F" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="248" cy="91" r="2.2" fill="#09937F" />

    <!-- Small Cross-Hatch Accent -->
    <path d="M 68,36 L 102,32"
          fill="none" stroke="#014842" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
