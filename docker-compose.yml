services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ishoot
      POSTGRES_PASSWORD: ishoot_password
      POSTGRES_DB: ishoot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ishoot.bh
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
