# Local stack for the backend (docs/backend/OPERATIONS.md). Everything binds to 127.0.0.1.
#   docker compose up -d                          Postgres, Valkey, SeaweedFS (S3), the gateway and the services
#   docker compose --profile observability up -d  + OpenTelemetry Collector, Prometheus, Loki, Tempo, Grafana
#   docker compose --profile tools up -d          + pgAdmin
# Values come from .env (see .env.example, "Backend" section).
name: platform

x-service: &service
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  environment: &service-env
    APP_ENV: ${APP_ENV:-development}
    LOG_LEVEL: ${LOG_LEVEL:-debug}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_INSECURE: "true"
    ADMIN_ENABLE_PPROF: ${ADMIN_ENABLE_PPROF:-false}

x-files: &files
  <<: *service
  build:
    context: backend
    args: { SERVICE: files }
  image: platform/files:dev
  environment:
    <<: *service-env
    SERVICE_NAME: files
    HTTP_BODY_LIMIT: ${FILES_HTTP_BODY_LIMIT:-11M}
    DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db}?sslmode=disable
    DATABASE_LOG_QUERIES: ${DATABASE_LOG_QUERIES:-false}
    S3_ENDPOINT: http://seaweedfs:8333
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    FILES_CREATE_BUCKETS: "true"
    AUTH_SERVICE_KEYS_FILE: /config/service-keys.json
  volumes:
    - ${SERVICE_KEYS_FILE:-./.local/service-keys.json}:/config/service-keys.json:ro

x-itsm: &itsm
  <<: *service
  build:
    context: backend
    args: { SERVICE: itsm }
  image: platform/itsm:dev
  environment:
    <<: *service-env
    SERVICE_NAME: itsm
    DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db}?sslmode=disable
    DATABASE_LOG_QUERIES: ${DATABASE_LOG_QUERIES:-false}
    AUTH_SERVICE_KEYS_FILE: /config/service-keys.json
    # IT-realm tokens for the desk are issued by identity.
    AUTH_ISSUER: ${AUTH_ISSUER:-http://identity:8080}
    AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://identity:8080/.well-known/jwks.json}
    ITSM_REQUEST_CALLERS: ${ITSM_REQUEST_CALLERS:-admin}
    ITSM_IT_DISPLAY_NAME: ${ITSM_IT_DISPLAY_NAME:-IT Support}
  volumes:
    - ${SERVICE_KEYS_FILE:-./.local/service-keys.json}:/config/service-keys.json:ro

x-identity: &identity
  <<: *service
  build:
    context: backend
    args: { SERVICE: identity }
  image: platform/identity:dev
  environment:
    <<: *service-env
    SERVICE_NAME: identity
    HTTP_TRUSTED_PROXIES: ${IDENTITY_TRUSTED_PROXIES:-}
    DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db}?sslmode=disable
    AUTH_SERVICE_KEYS_FILE: /keys/service-keys.json
    IDENTITY_ISSUER: ${IDENTITY_ISSUER:-http://identity:8080}
    IDENTITY_SIGNING_JWK: ${IDENTITY_SIGNING_JWK:-}
    IDENTITY_PREVIOUS_JWKS: ${IDENTITY_PREVIOUS_JWKS:-}
    IDENTITY_CALLERS_STAFF: ${IDENTITY_CALLERS_STAFF:-admin}
    IDENTITY_CALLERS_CUSTOMER: ${IDENTITY_CALLERS_CUSTOMER:-web}
    IDENTITY_CALLERS_IT: ${IDENTITY_CALLERS_IT:-it}
    IDENTITY_LOGIN_MFA_ENROLLMENT_TTL: ${IDENTITY_LOGIN_MFA_ENROLLMENT_TTL:-10m}
    IDENTITY_LOGIN_MFA_RECOVERY_COUNT: ${IDENTITY_LOGIN_MFA_RECOVERY_COUNT:-10}
    IDENTITY_LOGIN_ENABLED: ${IDENTITY_LOGIN_ENABLED:-true}
    IDENTITY_LOGIN_REDIS_URL: ${IDENTITY_LOGIN_REDIS_URL:-redis://:${VALKEY_PASSWORD}@valkey:6379/0}
    IDENTITY_LOGIN_RATE_KEY: ${IDENTITY_LOGIN_RATE_KEY:-}
    IDENTITY_LOGIN_MFA_KEYS: ${IDENTITY_LOGIN_MFA_KEYS:-}
    IDENTITY_LOGIN_MFA_PRIMARY_ID: ${IDENTITY_LOGIN_MFA_PRIMARY_ID:-primary}
    IDENTITY_LOGIN_MFA_LEGACY_KEY: ${IDENTITY_LOGIN_MFA_LEGACY_KEY:-}
    IDENTITY_LOGIN_IT_ALLOWED_CIDRS: ${IDENTITY_LOGIN_IT_ALLOWED_CIDRS:-}
    IDENTITY_ACCESS_TTL: ${IDENTITY_ACCESS_TTL:-}
    IDENTITY_SESSION_TTL: ${IDENTITY_SESSION_TTL:-}
    IDENTITY_JSON_BODY_LIMIT: ${IDENTITY_JSON_BODY_LIMIT:-}
    IDENTITY_LOGIN_ACCOUNT_ATTEMPTS: ${IDENTITY_LOGIN_ACCOUNT_ATTEMPTS:-}
    IDENTITY_LOGIN_IP_ATTEMPTS: ${IDENTITY_LOGIN_IP_ATTEMPTS:-}
    IDENTITY_LOGIN_RATE_WINDOW: ${IDENTITY_LOGIN_RATE_WINDOW:-}
    IDENTITY_LOGIN_MAX_CONCURRENT_KDF: ${IDENTITY_LOGIN_MAX_CONCURRENT_KDF:-}
    IDENTITY_LOGIN_PASSWORD_MEMORY_KIB: ${IDENTITY_LOGIN_PASSWORD_MEMORY_KIB:-}
    IDENTITY_LOGIN_PASSWORD_ITERATIONS: ${IDENTITY_LOGIN_PASSWORD_ITERATIONS:-}
    IDENTITY_LOGIN_PASSWORD_PARALLELISM: ${IDENTITY_LOGIN_PASSWORD_PARALLELISM:-}
    IDENTITY_LOGIN_PASSWORD_MAX_MEMORY_KIB: ${IDENTITY_LOGIN_PASSWORD_MAX_MEMORY_KIB:-}
    IDENTITY_LOGIN_PASSWORD_MAX_ITERATIONS: ${IDENTITY_LOGIN_PASSWORD_MAX_ITERATIONS:-}
    IDENTITY_LOGIN_PASSWORD_MAX_PARALLELISM: ${IDENTITY_LOGIN_PASSWORD_MAX_PARALLELISM:-}
    IDENTITY_LOGIN_PASSWORD_MAX_BCRYPT_COST: ${IDENTITY_LOGIN_PASSWORD_MAX_BCRYPT_COST:-}
    IDENTITY_LOGIN_TOTP_PERIOD: ${IDENTITY_LOGIN_TOTP_PERIOD:-}
    IDENTITY_LOGIN_TOTP_DIGITS: ${IDENTITY_LOGIN_TOTP_DIGITS:-}
    IDENTITY_LOGIN_TOTP_WINDOW: ${IDENTITY_LOGIN_TOTP_WINDOW:-}
  volumes:
    - ${SERVICE_KEYS_FILE:-./.local/service-keys.json}:/keys/service-keys.json:ro

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-platform_db}
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
      ]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--requirepass",
        "${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}",
      ]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'valkey-cli -a "$${VALKEY_PASSWORD}" --no-auth-warning ping | grep PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: ["server", "-s3", "-dir=/data", "-master.volumeSizeLimitMB=1024"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  files-migrate:
    <<: *files
    restart: "no"
    command: ["migrate"]
    healthcheck:
      disable: true
    ports: []
    depends_on:
      postgres: { condition: service_healthy }

  files:
    <<: *files
    command: ["serve"]
    ports:
      - "127.0.0.1:${FILES_ADMIN_PORT:-9081}:9090"
    depends_on:
      files-migrate: { condition: service_completed_successfully }
      seaweedfs: { condition: service_healthy }

  files-worker:
    <<: *files
    command: ["worker"]
    ports: []
    depends_on:
      files-migrate: { condition: service_completed_successfully }
      seaweedfs: { condition: service_healthy }

  itsm-migrate:
    <<: *itsm
    restart: "no"
    command: ["migrate"]
    healthcheck:
      disable: true
    ports: []
    depends_on:
      postgres: { condition: service_healthy }

  itsm:
    <<: *itsm
    command: ["serve"]
    ports:
      - "127.0.0.1:${ITSM_ADMIN_PORT:-9083}:9090"
    depends_on:
      itsm-migrate: { condition: service_completed_successfully }
      identity: { condition: service_healthy }

  itsm-worker:
    <<: *itsm
    command: ["worker"]
    ports: []
    depends_on:
      itsm-migrate: { condition: service_completed_successfully }

  gateway:
    <<: *service
    build:
      context: backend
      args: { SERVICE: gateway }
    image: platform/gateway:dev
    environment:
      <<: *service-env
      SERVICE_NAME: gateway
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      GATEWAY_ROUTES_FILE: /config/routes.yaml
      GATEWAY_UPSTREAMS: ${GATEWAY_UPSTREAMS:-files=http://files:8080,itsm=http://itsm:8080,identity=http://identity:8080}
      GATEWAY_IDENTITY_STATUS_URL: ${GATEWAY_IDENTITY_STATUS_URL:-http://identity:8080/v1/identity/session}
      GATEWAY_IDENTITY_STATUS_TIMEOUT: ${GATEWAY_IDENTITY_STATUS_TIMEOUT:-3s}
      HTTP_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-}
      HTTP_BODY_LIMIT: ${GATEWAY_HTTP_BODY_LIMIT:-11M}
      HTTP_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://identity:8080}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://identity:8080/.well-known/jwks.json}
      AUTH_SERVICE_KEYS_FILE: /keys/service-keys.json
    volumes:
      - ./deploy/helm/platform/files/gateway:/config:ro
      - ${SERVICE_KEYS_FILE:-./.local/service-keys.json}:/keys/service-keys.json:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
      - "127.0.0.1:${GATEWAY_ADMIN_PORT:-9080}:9090"
    depends_on:
      valkey: { condition: service_healthy }
      files: { condition: service_healthy }
      itsm: { condition: service_healthy }
      identity: { condition: service_healthy }

  identity-migrate:
    <<: *identity
    restart: "no"
    command: ["migrate"]
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  identity:
    <<: *identity
    command: ["serve"]
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-8082}:8080"
      - "127.0.0.1:${IDENTITY_ADMIN_PORT:-9082}:9090"
    depends_on:
      identity-migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }

  identity-worker:
    <<: *identity
    command: ["worker"]
    # The worker only needs the database, never the signing or service authentication keys.
    environment:
      <<: *service-env
      SERVICE_NAME: identity
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db}?sslmode=disable
      IDENTITY_CLEANUP_INTERVAL: ${IDENTITY_CLEANUP_INTERVAL:-}
      IDENTITY_CLEANUP_BATCH: ${IDENTITY_CLEANUP_BATCH:-}
      IDENTITY_CLEANUP_WORKERS: ${IDENTITY_CLEANUP_WORKERS:-}
    volumes: []
    depends_on:
      identity-migrate: { condition: service_completed_successfully }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: [observability]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"

  tempo:
    image: grafana/tempo:2.7.1
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:3.4.2
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]

  alloy:
    image: grafana/alloy:v1.7.1
    profiles: [observability]
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./deploy/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    restart: unless-stopped
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--web.enable-remote-write-receiver",
      ]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"

  grafana:
    image: grafana/grafana:11.5.2
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"

  pgadmin:
    image: dpage/pgadmin4:9.1
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres

volumes:
  pgdata17:
  s3data:
