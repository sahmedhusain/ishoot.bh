services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-platform_db}
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
      ]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--requirepass",
        "${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}",
      ]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'valkey-cli -a "$${VALKEY_PASSWORD}" --no-auth-warning ping | grep PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: ["server", "-s3", "-dir=/data", "-master.volumeSizeLimitMB=1024"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - s3data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  # Gives each service its own login, owning its schema and nothing else (tools/db-roles). Runs on every start.
  db-roles:
    <<: *service
    restart: "no"
    build:
      context: backend
      args: { SERVICE: db-roles, PACKAGE: ./tools/db-roles }
    image: platform/db-roles:dev
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db}?sslmode=disable
      DB_ROLES: audit,cms,commerce,delivery,files,finance,hr,identity,inventory,itsm,notify,realtime,sales,system,workflow
      DB_ROLE_PASSWORD_AUDIT: ${AUDIT_DB_PASSWORD:?Set AUDIT_DB_PASSWORD in .env}
      DB_ROLE_PASSWORD_CMS: ${CMS_DB_PASSWORD:?Set CMS_DB_PASSWORD in .env}
      DB_ROLE_PASSWORD_COMMERCE: ${COMMERCE_DB_PASSWORD:?Set COMMERCE_DB_PASSWORD in .env}
      DB_ROLE_PASSWORD_DELIVERY: ${DELIVERY_DB_PASSWORD:?Set DELIVERY_DB_PASSWORD in .env}
      DB_ROLE_PASSWORD_FILES: ${FILES_DB_PASSWORD:?Set FILES_DB_PASSWORD in .env}
      DB_ROLE_PASSWORD_FINANCE: ${FINANCE_DB_PASSWORD:?Set FINANCE_DB_PASSWORD in .env}
      DB_ROLE_PASSWORD_HR: ${HR_DB_PASSWORD:?Set HR_DB_PASSWORD in .env}
      DB_ROLE_PASSWORD_IDENTITY: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      DB_ROLE_PASSWORD_INVENTORY: ${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD in .env}
      DB_ROLE_PASSWORD_ITSM: ${ITSM_DB_PASSWORD:?Set ITSM_DB_PASSWORD in .env}
      DB_ROLE_PASSWORD_NOTIFY: ${NOTIFY_DB_PASSWORD:?Set NOTIFY_DB_PASSWORD in .env}
      DB_ROLE_PASSWORD_REALTIME: ${REALTIME_DB_PASSWORD:?Set REALTIME_DB_PASSWORD in .env}
      DB_ROLE_PASSWORD_SALES: ${SALES_DB_PASSWORD:?Set SALES_DB_PASSWORD in .env}
      DB_ROLE_PASSWORD_SYSTEM: ${SYSTEM_DB_PASSWORD:?Set SYSTEM_DB_PASSWORD in .env}
      DB_ROLE_PASSWORD_WORKFLOW: ${WORKFLOW_DB_PASSWORD:?Set WORKFLOW_DB_PASSWORD in .env}
      DB_ROLE_STATEMENT_TIMEOUT: ${DB_ROLE_STATEMENT_TIMEOUT:-15s}
    depends_on:
      postgres: { condition: service_healthy }

  # Transaction pooling for the services' request paths (deploy/pgbouncer/pgbouncer.ini).
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    environment:
      AUTH_TYPE: scram-sha-256
      DATABASE_URLS: >-
        postgres://svc_audit:${AUDIT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db},postgres://svc_cms:${CMS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db},postgres://svc_commerce:${COMMERCE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db},postgres://svc_delivery:${DELIVERY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db},postgres://svc_files:${FILES_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db},postgres://svc_finance:${FINANCE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db},postgres://svc_hr:${HR_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db},postgres://svc_identity:${IDENTITY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db},postgres://svc_inventory:${INVENTORY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db},postgres://svc_itsm:${ITSM_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db},postgres://svc_notify:${NOTIFY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db},postgres://svc_realtime:${REALTIME_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db},postgres://svc_sales:${SALES_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db},postgres://svc_system:${SYSTEM_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db},postgres://svc_workflow:${WORKFLOW_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db}
    volumes:
      - ./backend/deploy/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    ports:
      - "127.0.0.1:${PGBOUNCER_PORT:-6432}:6432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db-roles: { condition: service_completed_successfully }

  files-migrate:
    <<: *files
    restart: "no"
    command: ["migrate"]
    healthcheck:
      disable: true
    ports: []
    depends_on:
      db-roles: { condition: service_completed_successfully }

  files:
    <<: *files
    command: ["serve"]
    ports:
      - "127.0.0.1:${FILES_ADMIN_PORT:-9081}:9090"
    depends_on:
      files-migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  files-worker:
    <<: *files
    command: ["worker"]
    ports: []
    depends_on:
      files-migrate: { condition: service_completed_successfully }
      seaweedfs: { condition: service_healthy }

  system-migrate:
    <<: *system
    restart: "no"
    command: ["migrate"]
    healthcheck:
      disable: true
    ports: []
    depends_on:
      db-roles: { condition: service_completed_successfully }

  system:
    <<: *system
    command: ["serve"]
    ports:
      - "127.0.0.1:${SYSTEM_ADMIN_PORT:-9084}:9090"
    depends_on:
      system-migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      identity: { condition: service_healthy }
      nats: { condition: service_healthy }

  itsm-migrate:
    <<: *itsm
    restart: "no"
    command: ["migrate"]
    healthcheck:
      disable: true
    ports: []
    depends_on:
      db-roles: { condition: service_completed_successfully }

  itsm:
    <<: *itsm
    command: ["serve"]
    ports:
      - "127.0.0.1:${ITSM_ADMIN_PORT:-9083}:9090"
    depends_on:
      itsm-migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      identity: { condition: service_healthy }

  itsm-worker:
    <<: *itsm
    command: ["worker"]
    ports: []
    depends_on:
      itsm-migrate: { condition: service_completed_successfully }

  audit-migrate:
    <<: *audit
    restart: "no"
    command: ["migrate"]
    healthcheck:
      disable: true
    ports: []
    depends_on:
      db-roles: { condition: service_completed_successfully }

  audit:
    <<: *audit
    command: ["serve"]
    ports:
      - "127.0.0.1:${AUDIT_ADMIN_PORT:-9085}:9090"
    depends_on:
      audit-migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      identity: { condition: service_healthy }

  # Records every event from the EVENTS stream (its durable consumer resumes where it stopped).
  audit-worker:
    <<: *audit
    command: ["worker"]
    ports: []
    depends_on:
      audit-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  notify-migrate:
    <<: *notify
    restart: "no"
    command: ["migrate"]
    healthcheck:
      disable: true
    ports: []
    depends_on:
      db-roles: { condition: service_completed_successfully }

  notify:
    <<: *notify
    command: ["serve"]
    ports:
      - "127.0.0.1:${NOTIFY_ADMIN_PORT:-9086}:9090"
    depends_on:
      notify-migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      identity: { condition: service_healthy }
      nats: { condition: service_healthy } # live hints for the in-app inbox

  # Delivers queued messages and publishes notify's events.
  notify-worker:
    <<: *notify
    command: ["worker"]
    ports: []
    depends_on:
      notify-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
      system: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      whatsapp-sandbox: { condition: service_healthy }

  realtime-migrate:
    <<: *realtime
    restart: "no"
    command: ["migrate"]
    healthcheck:
      disable: true
    ports: []
    depends_on:
      db-roles: { condition: service_completed_successfully }

  # Live updates to the apps' browsers (Server-Sent Events) and people's statuses (ADR 0012).
  realtime:
    <<: *realtime
    command: ["serve"]
    ports:
      - "127.0.0.1:${REALTIME_ADMIN_PORT:-9087}:9090"
    depends_on:
      realtime-migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      identity: { condition: service_healthy }
      nats: { condition: service_healthy }
      valkey: { condition: service_healthy }

  # Stands in for the WhatsApp Cloud API locally (backend/tools/whatsapp-sandbox): http://localhost:8095 lists what
  # was sent; numbers ending in 0500, 0429 or 0400 fail on purpose.
  whatsapp-sandbox:
    <<: *service
    build:
      context: backend
      args: { SERVICE: whatsapp-sandbox, PACKAGE: ./tools/whatsapp-sandbox }
    image: platform/whatsapp-sandbox:dev
    environment: {}
    ports:
      - "127.0.0.1:${WHATSAPP_SANDBOX_PORT:-8095}:8080"

  cms-migrate:
    <<: *cms
    restart: "no"
    command: ["migrate"]
    healthcheck: { disable: true }
    ports: []
    depends_on:
      db-roles: { condition: service_completed_successfully }

  cms:
    <<: *cms
    ports:
      - "127.0.0.1:9088:9090"
    depends_on:
      cms-migrate: { condition: service_completed_successfully }

  commerce-migrate:
    <<: *commerce
    restart: "no"
    command: ["migrate"]
    healthcheck: { disable: true }
    ports: []
    depends_on:
      db-roles: { condition: service_completed_successfully }

  commerce:
    <<: *commerce
    ports:
      - "127.0.0.1:9089:9090"
    depends_on:
      commerce-migrate: { condition: service_completed_successfully }

  delivery-migrate:
    <<: *delivery
    restart: "no"
    command: ["migrate"]
    healthcheck: { disable: true }
    ports: []
    depends_on:
      db-roles: { condition: service_completed_successfully }

  delivery:
    <<: *delivery
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      delivery-migrate: { condition: service_completed_successfully }

  finance-migrate:
    <<: *finance
    restart: "no"
    command: ["migrate"]
    healthcheck: { disable: true }
    ports: []
    depends_on:
      db-roles: { condition: service_completed_successfully }

  finance:
    <<: *finance
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      finance-migrate: { condition: service_completed_successfully }

  hr-migrate:
    <<: *hr
    restart: "no"
    command: ["migrate"]
    healthcheck: { disable: true }
    ports: []
    depends_on:
      db-roles: { condition: service_completed_successfully }

  hr:
    <<: *hr
    ports:
      - "127.0.0.1:9092:9090"
    depends_on:
      hr-migrate: { condition: service_completed_successfully }

  inventory-migrate:
    <<: *inventory
    restart: "no"
    command: ["migrate"]
    healthcheck: { disable: true }
    ports: []
    depends_on:
      db-roles: { condition: service_completed_successfully }

  inventory:
    <<: *inventory
    ports:
      - "127.0.0.1:9093:9090"
    depends_on:
      inventory-migrate: { condition: service_completed_successfully }

  sales-migrate:
    <<: *sales
    restart: "no"
    command: ["migrate"]
    healthcheck: { disable: true }
    ports: []
    depends_on:
      db-roles: { condition: service_completed_successfully }

  sales:
    <<: *sales
    ports:
      - "127.0.0.1:9094:9090"
    depends_on:
      sales-migrate: { condition: service_completed_successfully }

  workflow-migrate:
    <<: *workflow
    restart: "no"
    command: ["migrate"]
    healthcheck: { disable: true }
    ports: []
    depends_on:
      db-roles: { condition: service_completed_successfully }

  workflow:
    <<: *workflow
    ports:
      - "127.0.0.1:9095:9090"
    depends_on:
      workflow-migrate: { condition: service_completed_successfully }

  gateway:
    <<: *service
    build:
      context: backend
      args: { SERVICE: gateway }
    image: platform/gateway:dev
    environment:
      <<: *service-env
      SERVICE_NAME: gateway
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      GATEWAY_ROUTES_FILE: /config/routes.yaml
      GATEWAY_UPSTREAMS: ${GATEWAY_UPSTREAMS:-audit=http://audit:8080,cms=http://cms:8080,commerce=http://commerce:8080,delivery=http://delivery:8080,files=http://files:8080,finance=http://finance:8080,hr=http://hr:8080,identity=http://identity:8080,inventory=http://inventory:8080,itsm=http://itsm:8080,notify=http://notify:8080,realtime=http://realtime:8080,sales=http://sales:8080,system=http://system:8080,workflow=http://workflow:8080}
      GATEWAY_IDENTITY_STATUS_URL: ${GATEWAY_IDENTITY_STATUS_URL:-http://identity:8080/v1/identity/session}
      GATEWAY_IDENTITY_STATUS_TIMEOUT: ${GATEWAY_IDENTITY_STATUS_TIMEOUT:-3s}
      HTTP_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-}
      HTTP_BODY_LIMIT: ${GATEWAY_HTTP_BODY_LIMIT:-11M}
      HTTP_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://identity:8080}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://identity:8080/.well-known/jwks.json}
      AUTH_SERVICE_KEYS_FILE: /keys/service-keys.json
    volumes:
      - ./backend/deploy/helm/platform/files/gateway:/config:ro
      - ${SERVICE_KEYS_FILE:-./.local/service-keys.json}:/keys/service-keys.json:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
      - "127.0.0.1:${GATEWAY_ADMIN_PORT:-9080}:9090"
    depends_on:
      valkey: { condition: service_healthy }
      files: { condition: service_healthy }
      itsm: { condition: service_healthy }
      identity: { condition: service_healthy }
      system: { condition: service_healthy }
      audit: { condition: service_healthy }
      notify: { condition: service_healthy }
      realtime: { condition: service_healthy }

  identity-migrate:
    <<: *identity
    restart: "no"
    command: ["migrate"]
    healthcheck: { disable: true }
    depends_on:
      db-roles: { condition: service_completed_successfully }

  identity:
    <<: *identity
    command: ["serve"]
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-8082}:8080"
      - "127.0.0.1:${IDENTITY_ADMIN_PORT:-9082}:9090"
    depends_on:
      identity-migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      valkey: { condition: service_healthy }

  identity-worker:
    <<: *identity
    command: ["worker"]
    # The worker only needs the database, never the signing or service authentication keys.
    environment:
      <<: *service-env
      SERVICE_NAME: identity
      DATABASE_URL: postgres://svc_identity:${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-platform_db}?sslmode=disable
      DATABASE_DIRECT_URL: postgres://svc_identity:${IDENTITY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform_db}?sslmode=disable
      IDENTITY_CLEANUP_INTERVAL: ${IDENTITY_CLEANUP_INTERVAL:-}
      IDENTITY_CLEANUP_BATCH: ${IDENTITY_CLEANUP_BATCH:-}
      IDENTITY_CLEANUP_WORKERS: ${IDENTITY_CLEANUP_WORKERS:-}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
    volumes: []
    depends_on:
      identity-migrate: { condition: service_completed_successfully }

  # Events (ADR 0003): JetStream keeps the EVENTS stream on disk; the services create it on start.
  nats:
    image: nats:2.12-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true'",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local mail: catches everything sent over SMTP (127.0.0.1:1025) and shows it at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: [observability]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"

  tempo:
    image: grafana/tempo:2.7.1
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:3.4.2
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]

  alloy:
    image: grafana/alloy:v1.7.1
    profiles: [observability]
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./deploy/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    restart: unless-stopped
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--web.enable-remote-write-receiver",
      ]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"

  grafana:
    image: grafana/grafana:11.5.2
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"

  # Scheduled dumps with retention: docker compose --profile backup up -d. Verify with scripts/restore-drill.sh.
  pg-backup:
    image: postgres:17-alpine
    profiles: [backup]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-platform}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-platform_db}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_KEEP: ${BACKUP_KEEP:-28}
    volumes:
      - ./backups:/backups
      - ./scripts/pg-backup-loop.sh:/usr/local/bin/pg-backup-loop.sh:ro
    entrypoint: ["sh", "/usr/local/bin/pg-backup-loop.sh"]

  pgadmin:
    image: dpage/pgadmin4:9.1
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-Admin12345678!}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: platform/web:dev
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
      IT_URL: ${IT_URL:-http://localhost:3002}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3001}
      NEXT_PUBLIC_IT_URL: ${NEXT_PUBLIC_IT_URL:-http://localhost:3002}
      API_URL: ${API_URL_CONTAINER:-http://gateway:8080}
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-http://identity:8080}
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL_CONTAINER:-http://identity:8080/.well-known/jwks.json}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-}
      WEB_SERVICE_KEY: ${WEB_SERVICE_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      ERASURE_HASH_KEY: ${ERASURE_HASH_KEY:-}
