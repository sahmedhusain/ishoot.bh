# Local stack for the backend (docs/backend/OPERATIONS.md). Everything binds to 127.0.0.1.
#   docker compose up -d                          Postgres, Valkey, SeaweedFS (S3), NATS, Mailpit, the gateway and the services
#   docker compose --profile observability up -d  + OpenTelemetry Collector, Prometheus, Loki, Tempo, Grafana
#   docker compose --profile tools up -d          + pgAdmin
# Values come from .env (see .env.example, "Backend" section).
name: platform

x-service: &service
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  environment: &service-env
    APP_ENV: ${APP_ENV:-development}
    LOG_LEVEL: ${LOG_LEVEL:-debug}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_INSECURE: "true"
    ADMIN_ENABLE_PPROF: ${ADMIN_ENABLE_PPROF:-false}

x-files: &files
  <<: *service
  build:
    context: backend
    args: { SERVICE: files }
  image: platform/files:dev
  environment:
    <<: *service-env
    SERVICE_NAME: files
    HTTP_BODY_LIMIT: ${FILES_HTTP_BODY_LIMIT:-11M}
    DATABASE_URL: postgres://svc_files:${FILES_DB_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-platform_db}?sslmode=disable
    DATABASE_DIRECT_URL: postgres://svc_files:${FILES_DB_PASSWORD:?Set FILES_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-platform_db}?sslmode=disable
    DATABASE_LOG_QUERIES: ${DATABASE_LOG_QUERIES:-false}
    S3_ENDPOINT: http://seaweedfs:8333
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    FILES_CREATE_BUCKETS: "true"
    AUTH_SERVICE_KEYS_FILE: /config/service-keys.json
  volumes:
    - ${SERVICE_KEYS_FILE:-./.local/service-keys.json}:/config/service-keys.json:ro

