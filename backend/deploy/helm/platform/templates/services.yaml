{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
{{- if $svc.configFiles }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels: {{- include "platform.labels" $ | nindent 4 }}
data:
  {{- range $file := $svc.configFiles }}
  {{ $file }}: {{ $.Files.Get (printf "files/%s/%s" $name $file) | required (printf "files/%s/%s is missing from the chart" $name $file) | quote }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" $ | nindent 4 }}
    {{- include "platform.selector" $ctx | nindent 4 }}
spec:
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "platform.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" $ | nindent 8 }}
        {{- include "platform.selector" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include "platform.configChecksum" (dict "root" $ "name" $name "svc" $svc) }}
    spec:
      {{- include "platform.podSpec" (dict "root" $ "name" $name "svc" $svc "probes" true) | nindent 6 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "platform.selector" $ctx | nindent 14 }}
{{- if and $svc.worker $svc.worker.enabled }}
{{- $workerCtx := dict "root" $ "name" $name "component" "worker" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-worker
  labels:
    {{- include "platform.labels" $ | nindent 4 }}
    {{- include "platform.selector" $workerCtx | nindent 4 }}
spec:
  replicas: {{ $svc.worker.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "platform.selector" $workerCtx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform.labels" $ | nindent 8 }}
        {{- include "platform.selector" $workerCtx | nindent 8 }}
    spec:
      {{- include "platform.podSpec" (dict "root" $ "name" $name "svc" $svc "probes" true "args" (list "worker")) | nindent 6 }}
{{- end }}
{{- if $svc.migrate }}
---
# Applies the service's migrations before its new version starts (ADR 0002). Safe to repeat.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrate
  labels: {{- include "platform.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "platform.labels" $ | nindent 8 }}
        {{- include "platform.selector" (dict "root" $ "name" $name "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "platform.podSpec" (dict "root" $ "name" $name "svc" $svc "probes" false "args" (list "migrate")) | nindent 6 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" $ | nindent 4 }}
    {{- include "platform.selector" $ctx | nindent 4 }}
spec:
  selector: {{- include "platform.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: admin, port: 9090, targetPort: admin }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels: {{- include "platform.labels" $ | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "platform.selector" $ctx | nindent 6 }}
{{- if $svc.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels: {{- include "platform.labels" $ | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $svc.autoscaling.targetCPU }} }
{{- end }}
{{- if $.Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels: {{- include "platform.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "platform.selector" $ctx | nindent 6 }}
  endpoints:
    - { port: admin, path: /metrics, interval: {{ $.Values.serviceMonitor.interval }} }
{{- end }}
{{- if $.Values.global.networkPolicy.enabled }}
{{- $callers := list }}
{{- range $other, $o := $.Values.services }}{{ if and $o.enabled (has $name $o.talksTo) }}{{ $callers = append $callers $other }}{{ end }}{{ end }}
---
# Deny by default. The HTTP port is reached only by the ingress controller (public services) or by the services
# that list this one in talksTo; the admin port only by monitoring; egress only to DNS, the services this one lists
# and the data stores.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels: {{- include "platform.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if $svc.public }}
    - ports: [{ port: http }]
      from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $.Values.global.networkPolicy.ingressNamespace }} }
    {{- end }}
    {{- if $callers }}
    - ports: [{ port: http }]
      from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: {{ toJson $callers }} }
    {{- end }}
    - ports: [{ port: admin }]
      from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $.Values.global.networkPolicy.monitoringNamespace }} }
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    {{- if $svc.talksTo }}
    - to:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: {{ toJson $svc.talksTo }} }
      ports: [{ port: http }]
    {{- end }}
    - ports: [{ port: 5432 }, { port: 6379 }, { port: 4222 }, { port: 4318 }, { port: 443 }, { port: 8333 }]
{{- end }}
{{- end }}
{{- end }}
