# Scrapes each service's admin listener (/metrics). Add a job per service as it joins the stack.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9090"]
  - job_name: files
    static_configs:
      - targets: ["files:9090", "files-worker:9090"]
