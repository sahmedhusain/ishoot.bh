; Connection pooling in front of Postgres for the backend services' request paths (docs/backend/OPERATIONS.md).
; Each service signs in with its own login (svc_<service>, tools/db-roles); the image writes userlist.txt from
; DATABASE_URLS at start. Migrations and River workers connect to Postgres directly: they need session features.
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
; pgx prepares statements; PgBouncer tracks them per server connection.
max_prepared_statements = 200
; Postgres does not report statement_timeout, so PgBouncer cannot keep a client's own value across pooled
; connections: it accepts and drops it, and each login's default applies (tools/db-roles, DB_ROLE_STATEMENT_TIMEOUT
; and DB_ROLE_STATEMENT_TIMEOUT_<SERVICE>). Direct connections (migrations, workers) still use their own value.
ignore_startup_parameters = extra_float_digits,statement_timeout
server_reset_query =
server_check_query = select 1
log_connections = 0
log_disconnections = 0
