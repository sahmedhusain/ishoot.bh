openapi: 3.1.0
info:
  title: Commerce Service (commerce)
  version: 1.0.0
  description: |
    Commerce service managing sales orders, order items, coupons, customers, customer addresses, and retail POS shifts.
servers:
  - url: /
tags:
  - name: orders
  - name: customers
  - name: coupons
  - name: retail
paths:
  /v1/commerce/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      security: [{ staffToken: [] }, { serviceToken: [] }]
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
    post:
      tags: [customers]
      operationId: createCustomer
      security: [{ staffToken: [] }, { serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerRequest" }
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }

  /v1/commerce/customers/{id}:
    get:
      tags: [customers]
      operationId: getCustomer
      security: [{ staffToken: [] }, { serviceToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }

  /v1/commerce/customers/erase-by-email:
    post:
      tags: [customers]
      operationId: eraseCustomerByEmail
      summary: Erase everything held for an e-mail address (right to erasure)
      description: >
        Erases every customer registered with the address and the guest orders placed with it, as eraseCustomer does,
        and tells delivery and sales to remove their copies. Always answers 204, known address or not.
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "204":
          description: Erasure done (or nothing was held)

  /v1/commerce/customers/{id}/erase:
    post:
      tags: [customers]
      operationId: eraseCustomer
      summary: Erase a customer's personal data (right to erasure)
      description: >
        Anonymizes the customer record, deletes saved addresses, and removes name, e-mail, phone, address and free-text
        notes from the customer's orders. Orders, line items, totals and payments are kept for accounting. Safe to repeat.
      security: [{ serviceToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Personal data erased
        "404":
          description: Unknown customer

  /v1/commerce/coupons:
    get:
      tags: [coupons]
      operationId: listCoupons
      security: [{ staffToken: [] }, { serviceToken: [] }]
      responses:
        "200":
          description: List of coupons
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Coupon" }
    post:
      tags: [coupons]
      operationId: createCoupon
      security: [{ staffToken: [] }, { serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCouponRequest" }
      responses:
        "201":
          description: Created coupon
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coupon" }

  /v1/commerce/orders:
    get:
      tags: [orders]
      operationId: listOrders
      security: [{ staffToken: [] }, { serviceToken: [] }]
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalesOrder" }
    post:
      tags: [orders]
      operationId: placeOrder
      security: [{ staffToken: [] }, { serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceOrderRequest" }
      responses:
        "201":
          description: Placed order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrder" }

  /v1/commerce/orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      security: [{ staffToken: [] }, { serviceToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrder" }

  /v1/commerce/orders/{id}/pay:
    post:
      tags: [orders]
      operationId: recordOrderPayment
      security: [{ staffToken: [] }, { serviceToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordPaymentRequest" }
      responses:
        "200":
          description: Payment recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrder" }

  /v1/commerce/orders/{id}/status:
    put:
      tags: [orders]
      operationId: updateOrderStatus
      security: [{ staffToken: [] }, { serviceToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStatusRequest" }
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesOrder" }

components:
  securitySchemes:
    staffToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Customer:
      type: object
      required: [id, firstName, lastName, status]
      properties:
        id: { type: string }
        email: { type: string }
        phone: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }

    CreateCustomerRequest:
      type: object
      required: [firstName, lastName]
      properties:
        email: { type: string }
        phone: { type: string }
        firstName: { type: string }
        lastName: { type: string }

    Coupon:
      type: object
      required: [id, code, discountType, discountValue, isActive]
      properties:
        id: { type: string }
        code: { type: string }
        discountType: { type: string }
        discountValue: { type: string }
        isActive: { type: boolean }

    CreateCouponRequest:
      type: object
      required: [code, discountType, discountValue]
      properties:
        code: { type: string }
        discountType: { type: string }
        discountValue: { type: string }

    SalesOrder:
      type: object
      required: [id, number, name, channel, status, paymentStatus, total, currency]
      properties:
        id: { type: string }
        number: { type: string }
        customerId: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        channel: { type: string }
        status: { type: string }
        paymentStatus: { type: string }
        paymentMethod: { type: string }
        total: { type: string }
        amountPaid: { type: string }
        currency: { type: string }
        placedAt: { type: string, format: date-time }

    PlaceOrderRequest:
      type: object
      required: [number, name, paymentMethod, total, currency, lines]
      properties:
        number: { type: string }
        customerId: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        channel: { type: string, default: "website" }
        paymentMethod: { type: string }
        subtotal: { type: string }
        total: { type: string }
        currency: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/SalesOrderLineInput" }

    SalesOrderLineInput:
      type: object
      required: [productId, sku, description, quantity, unitPrice, lineTotal]
      properties:
        productId: { type: string }
        sku: { type: string }
        description: { type: string }
        quantity: { type: string }
        unitPrice: { type: string }
        lineTotal: { type: string }

    RecordPaymentRequest:
      type: object
      required: [paymentStatus, amountPaid]
      properties:
        paymentStatus: { type: string }
        amountPaid: { type: string }

    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string }