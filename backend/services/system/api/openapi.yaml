    CompanyFont:
      {
        "oneOf":
          [
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["kind"],
              "properties": { "kind": { "const": "system", "type": "string" } },
            },
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["kind", "family"],
              "properties":
                {
                  "kind": { "const": "google", "type": "string" },
                  "family":
                    { "type": "string", "pattern": "^[A-Za-z0-9 ]{1,60}$" },
                },
            },
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["kind", "family", "files"],
              "properties":
                {
                  "kind": { "const": "upload", "type": "string" },
                  "family":
                    { "type": "string", "pattern": "^[A-Za-z0-9 ]{1,60}$" },
                  "files":
                    {
                      "type": "array",
                      "minItems": 1,
                      "maxItems": 9,
                      "items":
                        { "$ref": "#/components/schemas/CompanyFontFile" },
                    },
                },
            },
          ],
      }
