openapi: 3.1.0
info:
  title: System settings (system)
  version: 1.0.0
  description: |
    Installation-wide settings the IT team manages (ADR 0010). Modules, integrations, and the website's technical
    settings: its domains and its site-wide analytics ids and custom code. Module keys,
    names and defaults come from `contracts/catalog/modules.json`; a module nobody switched follows its default.
    Integrations credentials are encrypted at rest with AES-256-GCM.
servers:
  - url: /
tags:
  - name: services
  - name: desk
paths:
  /v1/system/modules:
    get:
      tags: [services]
      operationId: listModules
      description: General settings readers and configured module-only readers may read availability. Module-only readers cannot read integration credentials or site settings.
      security: [{ serviceToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Modules" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/system/modules/{key}:
    parameters: [{ $ref: "#/components/parameters/ModuleKey" }]
    put:
      tags: [services]
      operationId: setModule
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, actorId]
              properties:
                enabled: { type: boolean }
                actorId: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "204": { description: Saved }
        default: { $ref: "#/components/responses/Problem" }
  /v1/system/integrations:
    get:
      tags: [services]
      operationId: listIntegrations
      security: [{ serviceToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Integrations" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/system/sign-in/{provider}:
    get:
      tags: [services]
      operationId: getSignInConfiguration
      summary: Identity-only OAuth credentials and the approved website domain
      security: [{ serviceToken: [] }]
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, apple] }
      responses:
        "200":
          description: Configuration for identity; never forward credentials to the browser
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [active, values, websiteDomain]
                properties:
                  active: { type: boolean }
                  values:
                    { type: object, additionalProperties: { type: string } }
                  websiteDomain: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /v1/system/integrations/{provider}:
    parameters: [{ $ref: "#/components/parameters/ProviderId" }]
    get:
      tags: [services]
      operationId: getIntegration
      security: [{ serviceToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Integration" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [services]
      operationId: setIntegration
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveIntegrationServiceInput" }
      responses:
        "200": { $ref: "#/components/responses/Integration" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [services]
      operationId: unlinkIntegration
      security: [{ serviceToken: [] }]
      responses:
        "204": { description: Unlinked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/system/integrations/{provider}/status:
    parameters: [{ $ref: "#/components/parameters/ProviderId" }]
    put:
      tags: [services]
      operationId: updateIntegrationStatus
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UpdateIntegrationStatusInput" }
      responses:
        "204": { description: Updated }
        default: { $ref: "#/components/responses/Problem" }
  /v1/system/desk/modules:
    get:
      tags: [desk]
      operationId: listModulesForIT
      description: Needs `modules:read`.
      security: [{ userToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Modules" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/system/desk/modules/{key}:
    parameters: [{ $ref: "#/components/parameters/ModuleKey" }]
    put:
      tags: [desk]
      operationId: setModuleForIT
      description: Needs `modules:edit`.
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "204": { description: Saved }
        default: { $ref: "#/components/responses/Problem" }
  /v1/system/desk/integrations:
    get:
      tags: [desk]
      operationId: listIntegrationsForIT
      description: Needs `integrations:read`.
      security: [{ userToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/DeskIntegrations" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/system/desk/integrations/{provider}:
    parameters: [{ $ref: "#/components/parameters/ProviderId" }]
    put:
      tags: [desk]
      operationId: setIntegrationForIT
      description: Needs `integrations:edit`.
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveIntegrationITInput" }
      responses:
        "200": { $ref: "#/components/responses/DeskIntegration" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [desk]
      operationId: unlinkIntegrationForIT
      description: Needs `integrations:delete`.
      security: [{ userToken: [] }]
      responses:
        "204": { description: Unlinked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/system/site:
    get:
      tags: [services]
      operationId: getSite
      description: The website's domains and site-wide code, read by the apps to render and link the website.
      security: [{ serviceToken: [] }]
      responses:
        "200":
          description: The website's technical settings; empty values when none were saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/system/site/domains:
    put:
      tags: [services]
      operationId: setSiteDomains
      description: Sets the domains for the person the calling app acts for (the admin's setup wizard).
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/SiteDomainsInput" }
                - type: object
                  required: [actorId]
                  properties:
                    actorId: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200": { $ref: "#/components/responses/SiteDomains" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/system/desk/site/domains:
    get:
      tags: [desk]
      operationId: getSiteDomainsForIT
      description: Needs `domains:read`.
      security: [{ userToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/SiteDomains" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [desk]
      operationId: setSiteDomainsForIT
      description: Needs `domains:edit`. An empty domain clears it; the two must differ.
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteDomainsInput" }
      responses:
        "200": { $ref: "#/components/responses/SiteDomains" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/system/desk/site/code:
    get:
      tags: [desk]
      operationId: getSiteCodeForIT
      description: Needs `site_code:read`.
      security: [{ userToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/SiteCode" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [desk]
      operationId: setSiteCodeForIT
      description: Needs `site_code:edit`. Takes effect on the website at once.
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteCode" }
      responses:
        "200": { $ref: "#/components/responses/SiteCode" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/system/company:
    {
      "get":
        {
          "operationId": "getCompanyConfiguration",
          "summary": "Read company configuration (configured service readers)",
          "security": [{ "serviceToken": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/CompanyRecord" },
                        },
                    },
                },
              "default": { "$ref": "#/components/responses/Problem" },
            },
        },
      "put":
        {
          "operationId": "updateCompanyConfiguration",
          "summary": "Update company configuration for a named app actor",
          "security": [{ "serviceToken": [] }],
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    { "schema": { "$ref": "#/components/schemas/CompanyPatchServiceBody" } },
                },
            },
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/CompanyRecord" } },
                    },
                },
              "default": { "$ref": "#/components/responses/Problem" },
            },
        },
    }
  /v1/system/company/currency-use:
    {
      "post":
        {
          "operationId": "markCompanyCurrencyUsed",
          "summary": "Lock base currency after monetary use (configured monetary callers)",
          "security": [{ "serviceToken": [] }],
          "responses":
            {
              "204": { "description": "Success" },
              "default": { "$ref": "#/components/responses/Problem" },
            },
        },
    }
  /v1/system/company/assets/{key}:
    {
      "put":
        {
          "operationId": "saveCompanyAsset",
          "summary": "Save a company asset for a named app actor",
          "security": [{ "serviceToken": [] }],
          "parameters":
            [
              { "name": "key", "in": "path", "required": true, "schema": { "type": "string", "minLength": 1, "maxLength": 128 } },
            ],
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    { "schema": { "$ref": "#/components/schemas/CompanyAssetServiceBody" } },
                },
            },
          "responses":
            {
              "204": { "description": "Success" },
              "default": { "$ref": "#/components/responses/Problem" },
            },
        },
    }
  /v1/system/sequences/{kind}/reservations:
    {
      "post":
        {
          "operationId": "reserveDocumentNumber",
          "summary": "Idempotently reserve an invoice or receipt number",
          "security": [{ "serviceToken": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/NumberReservation",
                            },
                        },
                    },
                },
              "default": { "$ref": "#/components/responses/Problem" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "$ref": "#/components/schemas/NumberReservationInput",
                        },
                    },
                },
            },
          "parameters":
            [
              {
                "name": "kind",
                "in": "path",
                "required": true,
                "schema": { "type": "string", "enum": ["invoice", "receipt"] },
              },
            ],
        },
    }
  /v1/system/desk/company:
    {
      "get":
        {
          "operationId": "getCompanyConfigurationForIT",
          "summary": "Read company configuration (setup:read)",
          "security": [{ "userToken": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/CompanyRecord" },
                        },
                    },
                },
              "default": { "$ref": "#/components/responses/Problem" },
            },
        },
      "put":
        {
          "operationId": "updateCompanyConfigurationForIT",
          "summary": "Update company configuration (setup:edit)",
          "security": [{ "userToken": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/CompanyRecord" },
                        },
                    },
                },
              "default": { "$ref": "#/components/responses/Problem" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/CompanyPatchBody" },
                    },
                },
            },
        },
    }
  /v1/system/desk/setup/complete:
    {
      "post":
        {
          "operationId": "completeCompanySetupForIT",
          "summary": "Finish setup (setup:execute)",
          "security": [{ "userToken": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/CompanyRecord" },
                        },
                    },
                },
              "default": { "$ref": "#/components/responses/Problem" },
            },
        },
    }
  /v1/system/desk/company/assets:
    {
      "get":
        {
          "operationId": "listCompanyAssetsForIT",
          "summary": "List registered artwork (setup:read)",
          "security": [{ "userToken": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/CompanyAssetPage" },
                        },
                    },
                },
              "default": { "$ref": "#/components/responses/Problem" },
            },
        },
    }
  /v1/system/desk/company/assets/{key}:
    {
      "put":
        {
          "operationId": "saveCompanyAssetForIT",
          "summary": "Register permanent artwork (setup:edit)",
          "security": [{ "userToken": [] }],
          "responses":
            {
              "204": { "description": "Success" },
              "default": { "$ref": "#/components/responses/Problem" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/CompanyAssetInput" },
                    },
                },
            },
        },
      "delete":
        {
          "operationId": "deleteCompanyAssetForIT",
          "summary": "Remove an artwork registration (setup:edit)",
          "security": [{ "userToken": [] }],
          "responses":
            {
              "204": { "description": "Success" },
              "default": { "$ref": "#/components/responses/Problem" },
            },
        },
      "parameters":
        [
          {
            "name": "key",
            "in": "path",
            "required": true,
            "schema": { "type": "string", "pattern": "^[a-zA-Z0-9_-]{1,100}$" },
          },
        ],
    }

  /v1/system/setup/status:
    {
      "get":
        {
          "operationId": "getCompanySetupStatus",
          "summary": "Read setup completeness and missing fields",
          "security": [{ "serviceToken": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Setup status",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/CompanySetupStatus",
                            },
                        },
                    },
                },
              "default": { "$ref": "#/components/responses/Problem" },
            },
        },
    }
  /v1/system/desk/setup/status:
    {
      "get":
        {
          "operationId": "getCompanySetupStatusForIT",
          "summary": "Read setup completeness and missing fields",
          "security": [{ "userToken": [] }],
          "responses":
            {
              "200":
                {
                  "description": "Setup status",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/CompanySetupStatus",
                            },
                        },
                    },
                },
              "default": { "$ref": "#/components/responses/Problem" },
            },
        },
    }

components:
  securitySchemes:
    serviceToken: { type: http, scheme: bearer, bearerFormat: JWT }
    userToken: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ModuleKey:
      {
        name: key,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 64 },
      }
    ProviderId:
      {
        name: provider,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 64 },
      }
  responses:
    Modules:
      description: Every module in the catalogue with its current state, in catalogue order
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: "#/components/schemas/Module" }
    Integrations:
      description: Every stored integration with decrypted credentials
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: "#/components/schemas/ServiceIntegration" }
    Integration:
      description: One stored integration with decrypted credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ServiceIntegration" }
    DeskIntegrations:
      description: Every catalogue integration with masked secrets
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: "#/components/schemas/DeskIntegration" }
    DeskIntegration:
      description: One catalogue integration with masked secrets
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DeskIntegration" }
    SiteDomains:
      description: The website's and the admin's domains
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SiteDomains" }
    SiteCode:
      description: The site-wide analytics ids and custom code
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/SiteCode" }
              - { $ref: "#/components/schemas/Changed" }
    Problem:
      description: An error (RFC 9457). Codes include `module_not_found`, `integration_not_found`, `validation_failed`, `domains_must_differ`, `unauthenticated`, `forbidden`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Module:
      type: object
      required: [key, nameEn, nameAr, enabledByDefault, enabled]
      properties:
        key: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        enabledByDefault: { type: boolean }
        enabled: { type: boolean }
        updatedBy:
          {
            type: string,
            description: "Who switched it last: <caller>:<person> or it:<IT account>",
          }
        updatedAt: { type: string, format: date-time }
    SecretHint:
      type: object
      required: [set, hint]
      properties:
        set: { type: boolean }
        hint: { type: string }
    DeskIntegration:
      type: object
      required: [provider, isActive, healthStatus, values, secrets, config]
      properties:
        provider: { type: string }
        isActive: { type: boolean }
        healthStatus: { type: string }
        accountName: { type: [string, "null"] }
        lastError: { type: [string, "null"] }
        lastCheckedAt: { type: [string, "null"], format: date-time }
        lastSyncedAt: { type: [string, "null"], format: date-time }
        values:
          type: object
          additionalProperties: { type: string }
        secrets:
          type: object
          additionalProperties: { $ref: "#/components/schemas/SecretHint" }
        config:
          type: object
          additionalProperties: true
        updatedBy: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
    ServiceIntegration:
      type: object
      required: [provider, isActive, healthStatus, credentials, config]
      properties:
        provider: { type: string }
        isActive: { type: boolean }
        healthStatus: { type: string }
        accountName: { type: [string, "null"] }
        lastError: { type: [string, "null"] }
        lastCheckedAt: { type: [string, "null"], format: date-time }
        lastSyncedAt: { type: [string, "null"], format: date-time }
        credentials:
          type: object
          additionalProperties: { type: string }
        config:
          type: object
          additionalProperties: true
        updatedBy: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
    SaveIntegrationServiceInput:
      type: object
      required: [isActive, actorId]
      properties:
        isActive: { type: boolean }
        values:
          type: object
          additionalProperties: { type: string }
        config:
          type: object
          additionalProperties: true
        actorId: { type: string, minLength: 1, maxLength: 64 }
    SaveIntegrationITInput:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
        values:
          type: object
          additionalProperties: { type: string }
        config:
          type: object
          additionalProperties: true
    UpdateIntegrationStatusInput:
      type: object
      properties:
        healthStatus: { type: string }
        lastError: { type: [string, "null"] }
        accountName: { type: [string, "null"] }
        lastCheckedAt: { type: [string, "null"], format: date-time }
        lastSyncedAt: { type: [string, "null"], format: date-time }
        config:
          type: object
          additionalProperties: true
        refreshedCredentials:
          type: object
          additionalProperties: { type: string }
        syncLeaseToken: { type: [string, "null"] }
        syncLeaseUntil: { type: [string, "null"], format: date-time }
    Changed:
      type: object
      properties:
        updatedBy:
          {
            type: string,
            description: "Who changed it last: <caller>:<person> or it:<IT account>",
          }
        updatedAt: { type: string, format: date-time }
    CompanyPatchServiceBody:
      type: object
      required: [values, actorId]
      properties:
        values: { $ref: "#/components/schemas/CompanyPatch" }
        actorId: { type: string, minLength: 1, maxLength: 64 }
    CompanyAssetServiceBody:
      type: object
      required: [title, fileUrl, actorId]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        fileUrl: { type: string, minLength: 1, maxLength: 2048 }
        actorId: { type: string, minLength: 1, maxLength: 64 }
    SiteDomainsInput:
      type: object
      required: [websiteDomain, adminDomain]
      properties:
        websiteDomain:
          {
            type: string,
            maxLength: 300,
            description: "A public host name, or empty to clear",
          }
        adminDomain:
          {
            type: string,
            maxLength: 300,
            description: "A public host name, or empty to clear",
          }
    SiteDomains:
      allOf:
        - { $ref: "#/components/schemas/Changed" }
        - type: object
          required: [websiteDomain, adminDomain]
          properties:
            websiteDomain:
              { type: string, description: "Normalised host name, or empty" }
            adminDomain:
              { type: string, description: "Normalised host name, or empty" }
    SiteCode:
      type: object
      required:
        [googleAnalyticsId, metaPixelId, tiktokPixelId, headHtml, bodyHtml]
      properties:
        googleAnalyticsId: { type: string, description: "G-XXXX, or empty" }
        metaPixelId: { type: string, description: "Digits, or empty" }
        tiktokPixelId:
          {
            type: string,
            description: "Upper-case letters and digits, or empty",
          }
        headHtml: { type: string, maxLength: 50000 }
        bodyHtml: { type: string, maxLength: 50000 }
    Site:
      allOf:
        - { $ref: "#/components/schemas/Changed" }
        - type: object
          required: [websiteDomain, adminDomain, code]
          properties:
            websiteDomain: { type: string }
