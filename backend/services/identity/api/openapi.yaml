openapi: 3.1.0
info:
  title: Identity session lifecycle
  version: 0.1.0
  description: |
    Phase 3 preview contract; existing apps have not switched to this service.
    App servers authenticate with service tokens and pass opaque refresh credentials server-side.
    Identity allows only configured service callers for each realm.
    A refresh credential is usable once, only in its issuing realm. Reuse revokes its session family.
    Refreshing never extends the absolute session lifetime. When login is enabled, refresh also checks account status and issues a new access token.
servers:
  - url: /
security:
  - serviceToken: []
paths:
  /v1/identity/staff/access:
    get:
      operationId: getStaffAccess
      summary: Read the current staff account's effective permissions and scope policy
      description: |
        Requires a live staff session and a migrated staff access record. Stored grants, user overrides and
        current system module availability are evaluated in identity. Missing grants are denied; Super Admin
        retains access regardless of stored denials or module switches. This does not resolve department members.
        Staff app cutover is still pending; this endpoint reads identity's snapshot, not the legacy account tables.
      security: [{ userToken: [] }]
      responses:
        "200":
          description: Effective access, without credentials or personal profile data
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [subjectId, role, permissions, dataScopes]
                properties:
                  subjectId: { type: string }
                  role: { type: string }
                  permissions:
                    type: object
                    additionalProperties: { type: boolean }
                  dataScopes:
                    type: object
                    additionalProperties: false
                    required: [deals, requests, expenses, claims, leave]
                    properties:
                      deals: { type: string, enum: [own, department, all] }
                      requests: { type: string, enum: [own, department, all] }
                      expenses: { type: string, enum: [own, department, all] }
                      claims: { type: string, enum: [own, department, all] }
                      leave: { type: string, enum: [own, department, all] }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/desk/sessions:
    get:
      operationId: listIdentitySessionsForIT
      summary: List identity-issued sessions (sessions:read; live MFA-enrolled IT session required)
      description: Lists session families, including revoked and expired sessions awaiting cleanup. Legacy app sessions are not included. Never returns access or refresh credentials.
      security: [{ userToken: [] }]
      parameters:
        - {
            name: realm,
            in: query,
            schema: { type: string, enum: [staff, customer, it] },
          }
        - {
            name: subjectId,
            in: query,
            schema: { type: string, maxLength: 200 },
          }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        "200":
          description: Sessions ordered by ID; pass nextCursor back as cursor
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/DeskSession" },
                    }
                  nextCursor: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/desk/sessions/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    delete:
      operationId: revokeIdentitySessionForIT
      summary: Revoke an identity session family (sessions:delete)
      description: Invalidates access and refresh credentials for this family. Already revoked sessions are unchanged; missing sessions return 404. Revoking the current session signs the operator out.
      security: [{ userToken: [] }]
      responses:
        "204": { description: Session revoked or already revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/desk/it-accounts:
    get:
      operationId: listITAccounts
      summary: List IT accounts without credentials (it_accounts:read; live IT session required)
      security: [{ userToken: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        "200":
          description: Accounts ordered by ID; pass nextCursor back as cursor
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor, passwordMinLength]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/ITAccount" },
                    }
                  nextCursor: { type: string }
                  passwordMinLength:
                    { type: integer, minimum: 12, maximum: 128 }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createITAccount
      summary: Create an IT account with an enrolled factor (it_accounts:create)
      description: Returns provisioning material once. Never cache or log it; deliver it securely to the new account holder.
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password:
                  {
                    type: string,
                    minLength: 12,
                    maxLength: 1024,
                    writeOnly: true,
                  }
                role: { $ref: "#/components/schemas/ITRole" }
      responses:
        "201":
          description: Account created; provisioning secrets are returned only in this response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ITProvisioning" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/desk/it-accounts/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, minLength: 1, maxLength: 200 },
        }
    put:
      operationId: updateITAccount
      summary: Change role or active status and revoke sessions (it_accounts:edit)
      description: Refuses disabling or demoting the last active MFA-enrolled IT administrator. Accounts and audit references are retained.
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, active]
              properties:
                role: { $ref: "#/components/schemas/ITRole" }
                active: { type: boolean }
      responses:
        "204": { description: Access updated; existing sessions revoked }
        default: { $ref: "#/components/responses/Problem" }
  /.well-known/jwks.json:
    get:
      operationId: identityJWKS
      summary: Publish public signing keys
      security: []
      responses:
        "200":
          description: Public JSON Web Key Set
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { type: object }
  /v1/identity/session:
    get:
      operationId: validateIdentitySession
      summary: Check the current user token against live session, account and role state
      security:
        - userToken: []
      responses:
        "204":
          description: The token and its session are currently valid
        "401":
          description: Invalid token, expired or revoked session, disabled account or changed roles
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/identity/mfa/enrollment:
    post:
      operationId: beginMFAEnrollment
      summary: Start MFA enrollment after rechecking the account password
      security: [{ userToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/MFAPassword" }
      responses:
        "200":
          description: Temporary authenticator secret; never cache or log
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [secret, digits, periodSeconds, expiresAt]
                properties:
                  secret: { type: string }
                  digits: { type: integer, enum: [6, 8] }
                  periodSeconds: { type: integer, minimum: 1 }
                  expiresAt: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: cancelMFAEnrollment
      summary: Cancel pending MFA enrollment after rechecking the password
      security: [{ userToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/MFAPassword" }
      responses:
        "204": { description: Pending enrollment canceled }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/mfa/enrollment/confirm:
    post:
      operationId: confirmMFAEnrollment
      summary: Confirm a new factor and revoke existing sessions
      security: [{ userToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/MFAConfirmation" }
      responses:
        "200":
          description: One-time recovery codes; never cache or log
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recoveryCodes]
                properties:
                  recoveryCodes: { type: array, items: { type: string } }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/mfa/disable:
    post:
      operationId: disableMFA
      summary: Disable an existing factor and revoke sessions; IT accounts cannot disable MFA
      security: [{ userToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/MFAConfirmation" }
      responses:
        "204": { description: MFA disabled }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/{realm}/sessions/login:
    parameters:
      - $ref: "#/components/parameters/Realm"
    post:
      operationId: loginIdentitySession
      summary: Authenticate a password and, where required, an MFA or recovery code
      description: |
        Opt-in during migration. The calling app supplies clientIp only from a trusted ingress header.
        IT accounts require enrolled MFA. Errors do not reveal whether the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, minLength: 1, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 1024 }
                otp: { type: string, maxLength: 64 }
                clientIp: { type: string, maxLength: 45 }
                userAgent:
                  {
                    type: string,
                    maxLength: 512,
                    description: Shown to the person in their list of sessions,
                  }
      responses:
        "200":
          description: Authenticated session credentials; never cache or log
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginCredential"
        "401":
          description: Invalid credentials or MFA required after password verification
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/identity/{realm}/sessions/refresh:
    parameters:
      - $ref: "#/components/parameters/Realm"
    post:
      operationId: refreshIdentitySession
      summary: Consume and replace a refresh credential
      requestBody:
        $ref: "#/components/requestBodies/RefreshCredential"
      responses:
        "200":
          description: Rotated credential; never cache or log this response
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SessionCredential"
                  - $ref: "#/components/schemas/LoginCredential"
        "401":
          description: Invalid, expired, revoked or replayed credential; no reason is disclosed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/identity/{realm}/sessions/logout:
    parameters:
      - $ref: "#/components/parameters/Realm"
    post:
      operationId: logoutIdentitySession
      summary: Revoke a session family; validly formatted unknown credentials are an idempotent no-op
      requestBody:
        $ref: "#/components/requestBodies/RefreshCredential"
      responses:
        "204":
          description: Logged out
        default:
          $ref: "#/components/responses/Problem"
  /v1/identity/{realm}/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/ManagedRealm"
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, minLength: 1, maxLength: 200 },
        }
    put:
      operationId: syncManagedAccount
      summary: Create or update an account as the owning app describes it
      description: |
        Staff and customer accounts only; the caller must be the realm's app. Identity keeps the address, roles and
        active state the app sends and owns the credentials. Turning an account off or changing its roles revokes its
        sessions. Records identity.user.created or identity.user.changed.
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, active]
              properties:
                email: { type: string, minLength: 1, maxLength: 254 }
                roles:
                  {
                    type: array,
                    maxItems: 20,
                    items: { type: string, minLength: 1, maxLength: 100 },
                  }
                active: { type: boolean }
                actorId:
                  {
                    type: string,
                    maxLength: 64,
                    description: The person the app acts for,
                  }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/{realm}/accounts/{id}/password:
    parameters:
      - $ref: "#/components/parameters/ManagedRealm"
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, minLength: 1, maxLength: 200 },
        }
    put:
      operationId: setManagedAccountPassword
      summary: Set an account's password
      description: |
        Ends every session except keepSessionId (a person changing their own password stays signed in) and cancels
        open reset links. Passwords shorter than IDENTITY_LOGIN_PASSWORD_MIN_LENGTH are refused.
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 1024 }
                keepSessionId: { type: string, maxLength: 64 }
                actorId: { type: string, maxLength: 64 }
      responses:
        "204": { description: Password set }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/{realm}/accounts/{id}/mfa:
    parameters:
      - $ref: "#/components/parameters/ManagedRealm"
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, minLength: 1, maxLength: 200 },
        }
      - { name: actorId, in: query, schema: { type: string, maxLength: 64 } }
    delete:
      operationId: resetManagedAccountMFA
      summary: Turn two-step sign-in off for an account and sign it out everywhere
      security: [{ serviceToken: [] }]
      responses:
        "204": { description: Two-step sign-in is off }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/{realm}/password-resets:
    parameters:
      - $ref: "#/components/parameters/ManagedRealm"
    post:
      operationId: requestPasswordReset
      summary: Issue a one-use reset token for an active account with the address
      description: |
        Returns the token once for the app to e-mail; identity keeps only its hash. Unknown or inactive addresses
        answer 404 account_not_found: the app must answer the person the same way in both cases.
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                clientIp: { type: string, maxLength: 45 }
                email: { type: string, minLength: 1, maxLength: 254 }
      responses:
        "201":
          description: Token issued; never log it
          content:
            application/json:
              schema:
                type: object
                required: [subjectId, email, token, expiresAt]
                properties:
                  email: { type: string, format: email }
                  subjectId: { type: string }
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/{realm}/password-resets/confirm:
    parameters:
      - $ref: "#/components/parameters/ManagedRealm"
    post:
      operationId: confirmPasswordReset
      summary: Use a reset token once to set a new password
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                clientIp: { type: string, maxLength: 45 }
                email:
                  {
                    type: string,
                    maxLength: 254,
                    description: Required only for a legacy reset or invitation link,
                  }
                token: { type: string, minLength: 1, maxLength: 64 }
                password: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        "200":
          description: Password set; every session ended
          content:
            application/json:
              schema:
                type: object
                required: [subjectId]
                properties:
                  subjectId: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/me:
    get:
      operationId: getOwnAccountSecurity
      summary: The person's own sign-in settings
      security: [{ userToken: [] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    email,
                    mfaEnabled,
                    recoveryCodesLeft,
                    hasPassword,
                    google,
                    apple,
                  ]
                properties:
                  email: { type: string }
                  mfaEnabled: { type: boolean }
                  recoveryCodesLeft: { type: integer }
                  hasPassword: { type: boolean }
                  google: { type: boolean }
                  apple: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteOwnCustomerAccount
      summary: Erase the authenticated customer's credentials and end every session
      description: Staff accounts cannot be erased through this endpoint.
      security: [{ userToken: [] }]
      responses:
        "204": { description: Customer credentials erased }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/me/sessions:
    get:
      operationId: listOwnSessions
      summary: The signed-in staff member's or customer's active sessions, newest first
      security: [{ userToken: [] }]
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OwnSession" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: revokeOtherOwnSessions
      summary: End every session of the person except this one
      security: [{ userToken: [] }]
      responses:
        "204": { description: Other sessions ended }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/me/sessions/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, maxLength: 64 },
        }
    delete:
      operationId: revokeOwnSession
      summary: End one of the person's sessions (the current one signs them out)
      security: [{ userToken: [] }]
      responses:
        "204": { description: Session ended }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/me/password:
    put:
      operationId: changeOwnPassword
      summary: Change the person's own password
      description: |
        Checks the current password and, when two-step sign-in is on, an authenticator or recovery code (401
        mfa_required without one; 422 password_rejected when either is wrong or the new password is too short).
        Every session ends, including the current one; the person signs in with the new password.
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 1024 }
                newPassword: { type: string, minLength: 1, maxLength: 1024 }
                code: { type: string, maxLength: 64 }
                clientIp: { type: string, maxLength: 45 }
      responses:
        "204": { description: Password changed }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/customer/oauth/providers:
    get:
      operationId: customerSignInProviders
      summary: Enabled provider names without exposing their credentials
      security: [{ serviceToken: [] }]
      responses:
        "200":
          description: Available sign-in providers
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [google, apple]
                properties:
                  google: { type: boolean }
                  apple: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/customer/oauth/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, enum: [google, apple] }
    post:
      operationId: beginCustomerOAuth
      summary: Create a one-use provider flow with server-owned nonce and PKCE
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [redirectUri, next, locale]
              properties:
                redirectUri: { type: string, maxLength: 2048 }
                next: { type: string, maxLength: 2000 }
                locale: { type: string, enum: [en, ar] }
                clientIp: { type: string, maxLength: 45 }
      responses:
        "201":
          description: Store state in the server's httpOnly callback cookie before following authorizationUrl
          content:
            application/json:
              schema:
                type: object
                required: [state, authorizationUrl, expiresAt]
                properties:
                  state: { type: string }
                  authorizationUrl: { type: string }
                  expiresAt: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/customer/oauth/{provider}/complete:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, enum: [google, apple] }
    post:
      operationId: completeCustomerOAuth
      summary: Exchange the provider proof and issue a customer session once
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state, browserState]
              properties:
                state: { type: string, minLength: 43, maxLength: 43 }
                browserState: { type: string, minLength: 43, maxLength: 43 }
                code: { type: string, maxLength: 8192 }
                otp: { type: string, maxLength: 64 }
                name: { type: string, maxLength: 120 }
                clientIp: { type: string, maxLength: 45 }
                userAgent: { type: string, maxLength: 512 }
      responses:
        "200":
          description: Provider linked and session issued; an MFA-required response can be retried using state and otp
          content:
            application/json:
              schema:
                type: object
                required: [email, name, next, locale, credential]
                properties:
                  email: { type: string }
                  name: { type: string }
                  next: { type: string }
                  locale: { type: string }
                  credential: { $ref: "#/components/schemas/LoginCredential" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/customer/accounts:
    post:
      operationId: registerCustomerAccount
      summary: Register a customer credential without creating a staff or IT account
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                clientIp: { type: string, maxLength: 45 }
                email: { type: string, minLength: 1, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 1024 }
      responses:
        "201":
          description: Customer registered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [subjectId]
                properties:
                  subjectId: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /v1/identity/customer/sign-in-codes:
    post:
      operationId: issueCustomerSignInCode
      summary: Issue a one-use email sign-in code for the trusted website to deliver
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, minLength: 1, maxLength: 254 }
                clientIp: { type: string, maxLength: 45 }
      responses:
        "201":
          description: Code returned once; never log it or expose it to the browser
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, expiresAt]
                properties:
                  code: { type: string, pattern: "^[0-9]{6}$" }
                  expiresAt: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Problem" }
