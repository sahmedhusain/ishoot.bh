components:
  securitySchemes:
    serviceToken: { type: http, scheme: bearer, bearerFormat: JWT }
    userToken: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Realm:
      name: realm
      in: path
      required: true
      schema: { type: string, enum: [staff, customer, it] }
    ManagedRealm:
      name: realm
      in: path
      required: true
      schema: { type: string, enum: [staff, customer, it] }
  requestBodies:
    MFAPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [password]
            properties:
              password: { type: string, minLength: 1, maxLength: 1024 }
    MFAConfirmation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [password, code]
            properties:
              password: { type: string, minLength: 1, maxLength: 1024 }
              code: { type: string, minLength: 1, maxLength: 64 }
              currentCode: { type: string, maxLength: 64 }
    RefreshCredential:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [refreshToken]
            properties:
              refreshToken:
                type: string
                pattern: "^[A-Za-z0-9_-]{43}$"
                description: Opaque credential; never log it
  responses:
    Problem:
      description: RFC 9457 error; no credential or database detail is exposed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    OwnSession:
      type: object
      required: [id, createdAt, expiresAt, userAgent, clientIp, current]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        userAgent: { type: string, nullable: true }
        clientIp: { type: string, nullable: true }
        current: { type: boolean }
    DeskSession:
      type: object
      additionalProperties: false
      required: [id, realm, subjectId, email, createdAt, expiresAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        realm: { type: string, enum: [staff, customer, it] }
        subjectId: { type: string, minLength: 1 }
        email: { type: string, format: email, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
    ITRole:
      type: string
      enum: [it_admin, it_engineer, it_support, it_auditor]
    ITAccount:
      type: object
      additionalProperties: false
      required: [id, email, roles, active, mfaEnabled, createdAt, lastLoginAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { $ref: "#/components/schemas/ITRole" } }
        active: { type: boolean }
        mfaEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }
    ITProvisioning:
      type: object
      additionalProperties: false
      required: [subjectId, secret, otpAuthUrl, recoveryCodes]
      properties:
        subjectId: { type: string }
        secret: { type: string, minLength: 1 }
        otpAuthUrl: { type: string, format: uri }
        recoveryCodes: { type: array, minItems: 1, items: { type: string } }
    SessionCredential:
      type: object
      additionalProperties: false
      required: [sessionId, subjectId, realm, expiresAt, refreshToken]
      properties:
        sessionId: { type: string, format: uuid }
        subjectId: { type: string, minLength: 1 }
        realm: { type: string, enum: [staff, customer, it] }
        expiresAt: { type: string, format: date-time }
        refreshToken: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    LoginCredential:
      type: object
      additionalProperties: false
      required:
        [
          sessionId,
          subjectId,
          realm,
          expiresAt,
          refreshToken,
          accessToken,
          roles,
        ]
      properties:
        sessionId: { type: string, format: uuid }
        subjectId: { type: string, minLength: 1 }
        realm: { type: string, enum: [staff, customer, it] }
        expiresAt: { type: string, format: date-time }
        refreshToken: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        accessToken: { type: string }
        roles: { type: array, items: { type: string } }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        instance: { type: string }
    StaffDraft:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["email", "displayName", "role", "active"],
        "properties":
          {
            "email": { "type": "string", "format": "email", "maxLength": 254 },
            "displayName":
              { "type": "string", "minLength": 1, "maxLength": 120 },
            "role": { "type": "string" },
            "active": { "type": "boolean" },
            "overrides":
              {
                "type": "object",
                "additionalProperties": { "type": "boolean" },
              },
            "dataScopes":
              {
                "type": "object",
                "additionalProperties":
                  { "type": "string", "enum": ["own", "department", "all"] },
              },
            "copiedFrom": { "type": "string", "maxLength": 200 },
          },
      }
    StaffAccessTemplate:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["role", "overrides", "dataScopes"],
        "properties":
          {
            "role": { "type": "string", "minLength": 1, "maxLength": 200 },
            "overrides":
              {
                "type": "object",
                "additionalProperties": { "type": "boolean" },
              },
            "dataScopes":
              {
                "type": "object",
                "additionalProperties":
                  { "type": "string", "enum": ["own", "department", "all"] },
              },
          },
      }
    StaffRoleDraft:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "nameEn", "nameAr", "grants", "dataScopes"],
        "properties":
          {
            "id": { "type": "string", "minLength": 1, "maxLength": 200 },
            "nameEn": { "type": "string", "minLength": 1, "maxLength": 120 },
            "nameAr": { "type": "string", "minLength": 1, "maxLength": 120 },
            "system": { "type": "boolean" },
            "grants":
              {
                "type": "object",
                "additionalProperties": { "type": "boolean" },
              },
            "dataScopes":
              {
                "type": "object",
                "additionalProperties":
                  { "type": "string", "enum": ["own", "department", "all"] },
              },
          },
      }
    StaffDeskAccount:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          [
            "id",
            "email",
            "roles",
            "active",
            "mfaEnabled",
            "createdAt",
            "lastLoginAt",
            "displayName",
          ],
        "properties":
          {
            "id": { "type": "string", "minLength": 1, "maxLength": 200 },
            "email": { "type": "string" },
            "roles": { "type": "array", "items": { "type": "string" } },
            "active": { "type": "boolean" },
            "mfaEnabled": { "type": "boolean" },
            "createdAt": { "type": "string", "format": "date-time" },
            "lastLoginAt":
              { "type": "string", "format": "date-time", "nullable": true },
            "displayName": { "type": "string" },
          },
      }
    StaffAccessPreview:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["subjectId", "role", "permissions", "dataScopes"],
        "properties":
          {
            "subjectId": { "type": "string" },
            "role": { "type": "string" },
            "permissions":
              {
                "type": "object",
                "additionalProperties": { "type": "boolean" },
              },
            "dataScopes":
              {
                "type": "object",
                "additionalProperties":
                  { "type": "string", "enum": ["own", "department", "all"] },
              },
          },
      }
    StaffInvitation:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["subjectId", "email", "token", "expiresAt"],
        "properties":
          {
            "email": { "type": "string", "format": "email" },
            "subjectId": { "type": "string", "minLength": 1, "maxLength": 200 },
            "token": { "type": "string", "minLength": 43, "maxLength": 43 },
            "expiresAt": { "type": "string", "format": "date-time" },
          },
      }
    StaffDeskPage:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["items", "nextCursor"],
        "properties":
          {
            "items":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/StaffDeskAccount" },
              },
            "nextCursor": { "type": "string" },
          },
      }
    StaffRolePage:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["items", "nextCursor"],
        "properties":
          {
            "items":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/StaffRoleDraft" },
              },
            "nextCursor": { "type": "string" },
          },
      }
