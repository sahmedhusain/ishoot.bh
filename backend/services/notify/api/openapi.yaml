openapi: 3.1.0
info:
  title: Notifications (notify)
  version: 1.0.0
  description: |
    Delivers the platform's e-mail and WhatsApp messages. A caller queues a message with its own idempotency key; a
    worker sends it through the configured provider (SMTP or Resend for e-mail, the WhatsApp Cloud API) and retries
    transient failures. Each outcome is announced as an event (`notify.message.sent`, `notify.message.failed`). IT
    sees the queue, retries failed messages and sends test messages from the IT dashboard (`notifications`).
servers:
  - url: /
tags:
  - name: services
  - name: desk
  - name: inbox
    description: In-app notifications, settings and mutes, called by the apps' back ends for their signed-in people.
  - name: me
    description: The same for the signed-in IT account, with their own token.
paths:
  /v1/notify/messages:
    post:
      tags: [services]
      operationId: queueMessage
      description: |
        Queues a message. The same caller and `idempotencyKey` return the first message (200) instead of sending
        again; a new message answers 202.
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueueMessageInput" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "202": { $ref: "#/components/responses/Message" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/messages/{id}:
    get:
      tags: [services]
      operationId: getMessageStatus
      description: A message this caller queued.
      security: [{ serviceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/MessageId" }]
      responses:
        "200": { $ref: "#/components/responses/Message" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/desk/messages:
    get:
      tags: [desk]
      operationId: listMessagesForIT
      description: Newest first. Needs `notifications:read`.
      security: [{ userToken: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, sent, failed] } }
        - { name: channel, in: query, schema: { type: string, enum: [email, whatsapp] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: One page of messages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  nextCursor: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/desk/summary:
    get:
      tags: [desk]
      operationId: messageSummaryForIT
      description: The last 24 hours' messages by status and channel. Needs `notifications:read`.
      security: [{ userToken: [] }]
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [status, channel, messages]
                      properties:
                        status: { type: string }
                        channel: { type: string }
                        messages: { type: integer }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/desk/messages/{id}:
    get:
      tags: [desk]
      operationId: getMessageForIT
      description: A message with its text, HTML and attachment names. Needs `notifications:read`.
      security: [{ userToken: [] }]
      parameters: [{ $ref: "#/components/parameters/MessageId" }]
      responses:
        "200": { $ref: "#/components/responses/Message" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/desk/messages/{id}/retry:
    post:
      tags: [desk]
      operationId: retryMessageForIT
      description: Queues a failed message again. Needs `notifications:execute`. A message that has not failed answers 409.
      security: [{ userToken: [] }]
      parameters: [{ $ref: "#/components/parameters/MessageId" }]
      responses:
        "200": { $ref: "#/components/responses/Message" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/desk/test:
    post:
      tags: [desk]
      operationId: sendTestMessageForIT
      description: Sends a short test message. Needs `notifications:execute`.
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel, to]
              properties:
                channel: { type: string, enum: [email, whatsapp] }
                to: { type: string, minLength: 1, maxLength: 320 }
      responses:
        "202": { $ref: "#/components/responses/Message" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/inbox:
    post:
      tags: [inbox]
      operationId: deliverInApp
      description: |
        Delivers in-app notifications (ADR 0012), at most 500 per call, each to one person. A repeated `id`, or a
        repeated `dedupeKey` for the same person, is counted as a duplicate and changes nothing. A notification in a
        category or about a record the person muted is stored silently. `deliverAt` in the future shows it then.
        `createdAt`, `readAt` and `archivedAt` carry an earlier notification's state when it is handed over.
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: "#/components/schemas/NewNotification" }
      responses:
        "200":
          description: What was stored
          content:
            application/json:
              schema:
                type: object
                required: [created, duplicates, ids]
                properties:
                  created: { type: integer }
                  duplicates: { type: integer }
                  ids: { type: array, items: { type: string, format: uuid } }
        default: { $ref: "#/components/responses/Problem" }
    get:
      tags: [inbox]
      operationId: listInbox
      description: A page of one person's notifications, newest first, with their unread count (muted ones excluded).
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Realm" }
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/Categories" }
        - { $ref: "#/components/parameters/Filter" }
        - { $ref: "#/components/parameters/Category" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200": { $ref: "#/components/responses/InboxPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/inbox/summary:
    get:
      tags: [inbox]
      operationId: inboxSummary
      description: One person's unread notifications by category (muted ones excluded).
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Realm" }
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/Categories" }
      responses:
        "200": { $ref: "#/components/responses/InboxSummary" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/inbox/actions:
    post:
      tags: [inbox]
      operationId: actOnInbox
      description: |
        Marks read or unread, archives, restores or deletes the named notifications (`ids`), or every one the `filter`
        and `category` select (`all`). Answers how many changed and the new unread count; the person's other devices
        hear about it.
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Realm" }
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/Categories" }
      requestBody: { $ref: "#/components/requestBodies/InboxAction" }
      responses:
        "200": { $ref: "#/components/responses/InboxActionResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/inbox/{id}:
    get:
      tags: [inbox]
      operationId: getInboxItem
      description: One of the person's notifications; another person's answers 404.
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/NotificationId" }
        - { $ref: "#/components/parameters/Realm" }
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/Categories" }
      responses:
        "200": { $ref: "#/components/responses/InboxItem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/preferences:
    get:
      tags: [inbox]
      operationId: getPreferences
      description: One person's notification settings, with defaults for anything never set.
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Realm" }
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/Categories" }
      responses:
        "200": { $ref: "#/components/responses/Preferences" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [inbox]
      operationId: savePreferences
      description: Replaces one person's settings. Security notifications cannot be muted.
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Realm" }
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/Categories" }
      requestBody: { $ref: "#/components/requestBodies/Preferences" }
      responses:
        "200": { $ref: "#/components/responses/Preferences" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/mutes:
    get:
      tags: [inbox]
      operationId: listMutes
      description: The records one person muted.
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Realm" }
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200": { $ref: "#/components/responses/Mutes" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [inbox]
      operationId: muteRecord
      description: Silences future notifications about one record, until a time or until unmuted.
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Realm" }
        - { $ref: "#/components/parameters/UserId" }
      requestBody: { $ref: "#/components/requestBodies/Mute" }
      responses:
        "204": { description: Muted }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [inbox]
      operationId: unmuteRecord
      description: Lets notifications about a record ring again.
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Realm" }
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/EntityType" }
        - { $ref: "#/components/parameters/EntityId" }
      responses:
        "204": { description: Unmuted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/me/inbox:
    get:
      tags: [me]
      operationId: listMyInbox
      description: The signed-in IT account's notifications, in the categories their roles allow.
      security: [{ userToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Filter" }
        - { $ref: "#/components/parameters/Category" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200": { $ref: "#/components/responses/InboxPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/me/inbox/summary:
    get:
      tags: [me]
      operationId: myInboxSummary
      security: [{ userToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/InboxSummary" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/me/inbox/actions:
    post:
      tags: [me]
      operationId: actOnMyInbox
      security: [{ userToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/InboxAction" }
      responses:
        "200": { $ref: "#/components/responses/InboxActionResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/me/inbox/{id}:
    get:
      tags: [me]
      operationId: getMyInboxItem
      security: [{ userToken: [] }]
      parameters: [{ $ref: "#/components/parameters/NotificationId" }]
      responses:
        "200": { $ref: "#/components/responses/InboxItem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/me/preferences:
    get:
      tags: [me]
      operationId: getMyPreferences
      security: [{ userToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Preferences" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [me]
      operationId: saveMyPreferences
      security: [{ userToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/Preferences" }
      responses:
        "200": { $ref: "#/components/responses/Preferences" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/notify/me/mutes:
    get:
      tags: [me]
      operationId: listMyMutes
      security: [{ userToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Mutes" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [me]
      operationId: muteMyRecord
      security: [{ userToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/Mute" }
      responses:
        "204": { description: Muted }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [me]
      operationId: unmuteMyRecord
      security: [{ userToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/EntityType" }
        - { $ref: "#/components/parameters/EntityId" }
      responses:
        "204": { description: Unmuted }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    serviceToken: { type: http, scheme: bearer, bearerFormat: JWT }
    userToken: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    MessageId: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    NotificationId: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    Realm: { name: realm, in: query, required: true, schema: { type: string, enum: [staff, it] } }
    UserId: { name: userId, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    Categories:
      name: categories
      in: query
      description: Comma-separated categories the person may see (the app decides from their permissions); all of the realm's when omitted.
      schema: { type: string, maxLength: 2000 }
    Filter: { name: filter, in: query, schema: { type: string, enum: [all, unread, read, archived, muted] } }
    Category: { name: category, in: query, schema: { type: string, maxLength: 64 } }
    EntityType: { name: entityType, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
    EntityId: { name: entityId, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
  requestBodies:
    InboxAction:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [action]
            properties:
              action: { type: string, enum: [read, unread, archive, unarchive, delete] }
              ids: { type: array, maxItems: 500, items: { type: string, format: uuid } }
              all: { type: boolean, description: "Every notification the filter and category select, instead of ids" }
              filter: { type: string, enum: [all, unread, read, archived, muted] }
              category: { type: string, maxLength: 64 }
    Preferences:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Preferences" }
    Mute:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [entityType, entityId]
            properties:
              entityType: { type: string, minLength: 1, maxLength: 100 }
              entityId: { type: string, minLength: 1, maxLength: 100 }
              until: { type: string, nullable: true, format: date-time, description: Until unmuted when null }
  responses:
    Message:
      description: The message
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    Problem:
      description: An error (RFC 9457). Codes include `validation_failed`, `message_not_found`, `message_not_failed`, `notification_not_found`, `unauthenticated`, `forbidden`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InboxPage:
      description: One page of notifications
      content:
        application/json:
          schema:
            type: object
            required: [items, unread]
            properties:
              items: { type: array, items: { $ref: "#/components/schemas/InboxItem" } }
              unread: { type: integer }
              nextCursor: { type: string }
    InboxItem:
      description: The notification
      content:
        application/json:
          schema: { $ref: "#/components/schemas/InboxItem" }
    InboxSummary:
      description: Unread counts
      content:
        application/json:
          schema:
            type: object
            required: [unread, byCategory]
            properties:
              unread: { type: integer }
              byCategory: { type: object, additionalProperties: { type: integer } }
    InboxActionResult:
      description: How many changed, and the unread count after
      content:
        application/json:
          schema:
            type: object
            required: [changed, unread]
            properties:
              changed: { type: integer }
              unread: { type: integer }
    Preferences:
      description: The settings
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Preferences" }
    Mutes:
      description: The muted records
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items:
                  type: object
                  required: [entityType, entityId, until, createdAt]
                  properties:
                    entityType: { type: string }
                    entityId: { type: string }
                    until: { type: string, nullable: true, format: date-time }
                    createdAt: { type: string, format: date-time }
  schemas:
    NewNotification:
      type: object
      additionalProperties: false
      required: [realm, recipient, title]
      properties:
        id: { type: string, format: uuid, description: Generated when omitted }
        realm: { type: string, enum: [staff, it] }
        recipient: { type: string, minLength: 1, maxLength: 128 }
        category: { type: string, maxLength: 64, description: From the message key or entity type when omitted }
        priority: { type: string, enum: [low, normal, high, urgent], description: The category's when omitted }
        title: { type: string, minLength: 1, maxLength: 300 }
        body: { type: string, maxLength: 2000 }
        messageKey: { type: string, maxLength: 200, description: A translation key the apps show instead of title and body }
        messageParams: { type: object, additionalProperties: { type: string } }
        actionUrl: { type: string, maxLength: 1000, description: "A path in the app, starting with one /" }
        entityType: { type: string, maxLength: 100 }
        entityId: { type: string, maxLength: 100 }
        actorId: { type: string, maxLength: 64 }
        dedupeKey: { type: string, maxLength: 200 }
        deliverAt: { type: string, nullable: true, format: date-time }
        createdAt: { type: string, nullable: true, format: date-time }
        readAt: { type: string, nullable: true, format: date-time }
        archivedAt: { type: string, nullable: true, format: date-time }
    InboxItem:
      type: object
      required: [id, category, priority, title, body, messageKey, messageParams, actionUrl, entityType, entityId, actorId, silent, read, archived, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        priority: { type: string, enum: [low, normal, high, urgent] }
        title: { type: string }
        body: { type: string }
        messageKey: { type: string, nullable: true }
        messageParams: { type: object, additionalProperties: { type: string } }
        actionUrl: { type: string, nullable: true }
        entityType: { type: string, nullable: true }
        entityId: { type: string, nullable: true }
        actorId: { type: string, nullable: true }
        silent: { type: boolean, description: Arrived while its category or record was muted }
        read: { type: boolean }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time, description: When it appeared in the inbox }
        readAt: { type: string, nullable: true, format: date-time }
    Preferences:
      type: object
      required: [mutedUntil, soundEnabled, sound, volume, popupsEnabled, desktopEnabled, categories]
      properties:
        mutedUntil: { type: string, nullable: true, format: date-time, description: "Everything is quiet until then; 9999-12-31 means until turned back on" }
        soundEnabled: { type: boolean }
        sound: { type: string, enum: [chime, ping, pop, bell, alert] }
        volume: { type: integer, minimum: 0, maximum: 100 }
        popupsEnabled: { type: boolean }
        desktopEnabled: { type: boolean }
        categories:
          type: array
          maxItems: 64
          items:
            type: object
            required: [category, muted, sound]
            properties:
              category: { type: string }
              muted: { type: boolean }
              sound: { type: boolean }
              mandatory: { type: boolean, description: Read-only; mandatory categories cannot be muted }
    QueueMessageInput:
      type: object
      required: [channel, to, idempotencyKey]
      properties:
        channel: { type: string, enum: [email, whatsapp] }
        to: { type: string, maxLength: 320, description: "An e-mail address, or a phone number with its country code" }
        subject: { type: string, maxLength: 998, description: Required for e-mail; not allowed for WhatsApp }
        text: { type: string, description: "Plain text (required for WhatsApp, up to 4096 characters)" }
        html: { type: string, description: E-mail only }
        attachments:
          type: array
          maxItems: 10
          description: E-mail only; together at most NOTIFY_MAX_ATTACHMENT_BYTES
          items:
            type: object
            required: [filename, content]
            properties:
              filename: { type: string, maxLength: 200 }
              contentType: { type: string, maxLength: 200 }
              content: { type: string, format: byte }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        actorId: { type: string, maxLength: 64, description: The person the caller acts for }
    Message:
      type: object
      required: [id, caller, actor, channel, recipient, subject, status, attempts, provider, providerId, lastError, createdAt, sentAt]
      properties:
        id: { type: string, format: uuid }
        caller: { type: string }
        actor: { type: string, nullable: true }
        channel: { type: string, enum: [email, whatsapp] }
        recipient: { type: string }
        subject: { type: string, nullable: true }
        status: { type: string, enum: [queued, sent, failed] }
        attempts: { type: integer }
        provider: { type: string, nullable: true }
        providerId: { type: string, nullable: true }
        lastError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, nullable: true, format: date-time }
        text: { type: string, nullable: true, description: IT detail only }
        html: { type: string, nullable: true, description: IT detail only }
        attachments:
          type: array
          description: IT detail only
          items:
            type: object
            required: [filename, contentType, size]
            properties:
              filename: { type: string }
              contentType: { type: string }
              size: { type: integer }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
