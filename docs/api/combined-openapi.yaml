  /v1/files/uploads/import:
    post:
      description: |
        For a profile picture given as a link. Only public http(s) addresses are reached (checked after DNS resolution,
        redirects included); the bytes must be a type the folder accepts. The upload expires unless claimed, like one
        the owner sent. Problems: `source_not_allowed`, `source_unreachable`, `unsupported_file_type`, `payload_too_large`.
      operationId: importUpload
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                folder:
                  maxLength: 40
                  type: string
                ownerId:
                  maxLength: 64
                  type: string
                url:
                  maxLength: 2048
                  type: string
              required:
                - ownerId
                - folder
                - url
              type: object
        required: true
      responses:
        "201":
          $ref: '#/components/responses/File'
        default:
          $ref: '#/components/responses/Problem'
      summary: Download a file from a link into an upload the owner can claim
      tags:
        - uploads
        - Files
        - Web
