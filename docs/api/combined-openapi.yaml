                format: date-time
                type:
                  - string
                  - "null"
            required:
              - entityType
              - entityId
            type: object
      required: true
    Preferences:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Preferences'
      required: true
    RefreshCredential:
      content:
        application/json:
          schema:
            additionalProperties: false
            properties:
              refreshToken:
                description: Opaque credential; never log it
                pattern: ^[A-Za-z0-9_-]{43}$
                type: string
            required:
              - refreshToken
            type: object
      required: true
    Status:
      content:
        application/json:
          schema:
            additionalProperties: false
            properties:
              expiresAt:
                description: Until changed when null
                format: date-time
                type:
                  - string
                  - "null"
              message:
                description: Up to the catalogue's message length
                maxLength: 1000
                type:
                  - string
                  - "null"
              status:
                description: A status from the catalogue that can be chosen
                type: string
            required:
              - status
            type: object
      required: true
