paths:
  /.well-known/jwks.json:
    get:
      description: Publish public signing keys
      operationId: identityJWKS
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  keys:
                    items:
                      type: object
                    type: array
                required:
                  - keys
                type: object
          description: Public JSON Web Key Set
      security: []
      summary: Publish public signing keys
      tags:
        - Identity
        - Admin
  /v1/audit/desk/events:
    get:
      description: Newest first. Filters combine; `from` is inclusive and `to` exclusive.
      operationId: listAuditEvents
      parameters:
        - in: query
          name: subject
          schema:
            maxLength: 200
            type: string
        - in: query
          name: service
          schema:
            maxLength: 64
            type: string
        - in: query
          name: actor
          schema:
            maxLength: 200
            type: string
        - in: query
          name: from
          schema:
            format: date-time
            type: string
        - in: query
          name: to
          schema:
            format: date-time
            type: string
        - in: query
          name: limit
          schema:
            maximum: 1000
            minimum: 1
            type: integer
        - in: query
          name: cursor
          schema:
            maxLength: 200
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                    type: array
                  nextCursor:
                    description: Pass as `cursor` for the next page; absent on the last page
                    type: string
                required:
                  - items
                type: object
          description: One page of events
        default:
          $ref: '#/components/responses/Problem'
      security:
        - userToken: []
      tags:
        - desk
        - Audit
        - Admin
        - IT
  /v1/audit/desk/events/{id}:
    get:
      description: get operation for /v1/audit/desk/events/{id}
      operationId: getAuditEvent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
          description: The event
        default:
          $ref: '#/components/responses/Problem'
      security:
        - userToken: []
      tags:
        - desk
        - Audit
        - Admin
        - IT
  /v1/audit/desk/subjects:
    get:
      description: Every subject recorded, with counts, for filtering.
      operationId: listAuditSubjects
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  items:
                    items:
                      properties:
                        events:
                          type: integer
                        lastAt:
                          format: date-time
                          type: string
                        subject:
                          type: string
                      required:
                        - subject
                        - events
                        - lastAt
                      type: object
                    type: array
                required:
                  - items
                type: object
          description: Subjects
        default:
          $ref: '#/components/responses/Problem'
      security:
        - userToken: []
      tags:
        - desk
        - Audit
        - Admin
        - IT
