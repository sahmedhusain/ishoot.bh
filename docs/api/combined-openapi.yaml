components:
  schemas:
    AdjustStockRequest:
      properties:
        locationId:
          type: string
        movementType:
          type: string
        note:
          type: string
        productId:
          type: string
        quantity:
          type: string
        reason:
          type: string
        unitCost:
          type: string
        variantId:
          type: string
      required:
        - productId
        - locationId
        - quantity
        - movementType
      type: object
    ApprovalDecision:
      properties:
        approverId:
          type: string
        comments:
          nullable: true
          type: string
        decidedAt:
          format: date-time
          type: string
        decision:
          type: string
        id:
          type: string
        requestId:
          type: string
      required:
        - id
        - requestId
        - approverId
        - decision
        - decidedAt
      type: object
    ApprovalRequest:
      properties:
        createdAt:
          format: date-time
          type: string
        entityId:
          type: string
        id:
          type: string
        kind:
          type: string
        priority:
          type: string
        reason:
          nullable: true
          type: string
        requesterId:
          type: string
        status:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - kind
        - entityId
        - requesterId
        - status
        - priority
        - createdAt
        - updatedAt
      type: object
    ApprovalRequestWithDecisions:
      allOf:
        - $ref: '#/components/schemas/ApprovalRequest'
        - properties:
            decisions:
              items:
                $ref: '#/components/schemas/ApprovalDecision'
              type: array
          type: object
    Article:
      properties:
        authorName:
          nullable: true
          type: string
        bodyAr:
          additionalProperties: true
          nullable: true
          type: object
        bodyEn:
          additionalProperties: true
          nullable: true
          type: object
        bodyHtmlAr:
          nullable: true
          type: string
        bodyHtmlEn:
          nullable: true
          type: string
        category:
          type: string
        coverUrl:
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        excerptAr:
          nullable: true
          type: string
        excerptEn:
          nullable: true
          type: string
        featured:
          type: boolean
        id:
          type: string
        publishAt:
          format: date-time
          nullable: true
          type: string
        seoDescriptionAr:
          nullable: true
          type: string
        seoDescriptionEn:
          nullable: true
          type: string
        seoTitleAr:
          nullable: true
          type: string
        seoTitleEn:
          nullable: true
          type: string
        slug:
          type: string
        status:
          type: string
        tags:
          items:
            type: string
          type: array
        titleAr:
          type: string
        titleEn:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - slug
        - titleEn
        - titleAr
        - category
        - tags
        - status
        - featured
        - createdAt
        - updatedAt
      type: object
    AssignDriverRequest:
      properties:
        driverId:
          type: string
        routeSheetId:
          type: string
        routeStop:
          type: integer
        vehicleId:
          type: string
      required:
        - driverId
      type: object
    Attachment:
      additionalProperties: false
      properties:
        commentId:
          format: uuid
          type: string
        fileName:
          maxLength: 200
          type: string
        fileSize:
          minimum: 1
          type: integer
        fileUrl:
          maxLength: 300
          type: string
        mimeType:
          maxLength: 100
          type: string
      required:
        - fileUrl
        - fileName
        - mimeType
        - fileSize
      type: object
    AuditEvent:
      properties:
        actor:
          description: 'Who made the change: <caller>:<person> or it:<IT account>'
          type:
            - string
            - "null"
        entity:
          type: string
        id:
          description: The event ID the publishing service gave it
          format: uuid
          type: string
        occurredAt:
          description: When the broker stored the event
          format: date-time
          type: string
        payload:
          additionalProperties: true
          type: object
        receivedAt:
          format: date-time
          type: string
        service:
          type: string
        subject:
          description: <service>.<entity>.<verb>
          type: string
        traceId:
          description: The W3C trace the change happened in
          type:
            - string
            - "null"
        verb:
          type: string
      required:
        - id
        - subject
        - service
        - entity
        - verb
        - actor
        - occurredAt
        - receivedAt
        - payload
        - traceId
      type: object
    BankSettlement:
