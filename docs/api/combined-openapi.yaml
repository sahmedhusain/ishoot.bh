  /v1/identity/staff/access:
    get:
      description: |
        Requires a live staff session and a migrated staff access record. Stored grants, user overrides and
        current system module availability are evaluated in identity. Missing grants are denied; Super Admin
        retains access regardless of stored denials or module switches. This does not resolve department members.
        Staff app cutover is still pending; this endpoint reads identity's snapshot, not the legacy account tables.
      operationId: getStaffAccess
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  dataScopes:
                    additionalProperties: false
                    properties:
                      claims:
                        enum:
                          - own
                          - department
                          - all
                        type: string
                      deals:
                        enum:
                          - own
                          - department
                          - all
                        type: string
                      expenses:
                        enum:
                          - own
                          - department
                          - all
                        type: string
                      leave:
                        enum:
                          - own
                          - department
                          - all
                        type: string
                      requests:
                        enum:
                          - own
                          - department
                          - all
                        type: string
                    required:
                      - deals
                      - requests
                      - expenses
                      - claims
                      - leave
                    type: object
                  permissions:
                    additionalProperties:
                      type: boolean
                    type: object
                  role:
                    type: string
                  subjectId:
                    type: string
                required:
                  - subjectId
                  - role
                  - permissions
                  - dataScopes
                type: object
          description: Effective access, without credentials or personal profile data
        default:
          $ref: '#/components/responses/Problem'
      security:
        - userToken: []
      summary: Read the current staff account's effective permissions and scope policy
      tags:
        - Identity
        - Admin
