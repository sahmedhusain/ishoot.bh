  /v1/realtime/stream:
    get:
      description: |
        A Server-Sent Events stream for one person. Every event is one JSON object `{type, data}` on a `data:` line:
        first `realtime.ready`, then hints for the person, their topics and their realm's statuses
        (`presence.<realm>`). A comment line is sent every heartbeat. After the maximum age the server sends
        `realtime.reconnect` and closes; a slow or ended stream gets `realtime.closed`.
      operationId: openStream
      parameters:
        - $ref: '#/components/parameters/QueryRealm'
        - $ref: '#/components/parameters/UserId'
        - description: Comma-separated topics the app allows this person to follow.
          in: query
          name: topics
          schema:
            maxLength: 4000
            type: string
        - description: The person's session, so the stream closes when it is revoked.
          in: query
          name: session
          schema:
            maxLength: 128
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: The stream
        default:
          $ref: '#/components/responses/Problem'
      security:
        - serviceToken: []
      tags:
        - services
        - Realtime
        - Admin
        - IT
  /v1/realtime/windows:
    delete:
      description: Removes one record's window for everyone.
      operationId: removeWindow
      parameters:
        - $ref: '#/components/parameters/QueryRealm'
        - in: query
          name: source
          required: true
          schema:
            maxLength: 32
            type: string
        - in: query
          name: sourceId
          required: true
          schema:
            maxLength: 100
            type: string
      responses:
        "204":
          description: Removed
        default:
          $ref: '#/components/responses/Problem'
      security:
        - serviceToken: []
      tags:
        - services
        - Realtime
        - Admin
        - IT
    put:
      description: Sets one record's window (a meeting, a leave request) for exactly the people given.
      operationId: replaceWindow
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WindowInput'
                - properties:
                    realm:
                      enum:
                        - staff
                        - it
                      type: string
                    source:
                      description: e.g. calendar, leave
                      pattern: ^[a-z][a-z0-9_]{0,31}$
                      type: string
                  required:
                    - realm
                    - source
                  type: object
        required: true
      responses:
        "204":
          description: Stored
        default:
          $ref: '#/components/responses/Problem'
      security:
        - serviceToken: []
      tags:
        - services
        - Realtime
        - Admin
        - IT
