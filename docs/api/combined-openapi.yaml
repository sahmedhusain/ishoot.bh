        - inbox
        - Notify
        - Admin
        - IT
    post:
      description: |
        Delivers in-app notifications (ADR 0012), at most 500 per call, each to one person. A repeated `id`, or a
        repeated `dedupeKey` for the same person, is counted as a duplicate and changes nothing. A notification in a
        category or about a record the person muted is stored silently. `deliverAt` in the future shows it then.
        `createdAt`, `readAt` and `archivedAt` carry an earlier notification's state when it is handed over.
      operationId: deliverInApp
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/NewNotification'
                  maxItems: 500
                  minItems: 1
                  type: array
              required:
                - items
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  created:
                    type: integer
                  duplicates:
                    type: integer
                  ids:
                    items:
                      format: uuid
                      type: string
                    type: array
                required:
                  - created
                  - duplicates
                  - ids
                type: object
          description: What was stored
        default:
          $ref: '#/components/responses/Problem'
