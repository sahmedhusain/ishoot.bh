            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                active:
                  type: boolean
                actorId:
                  description: The person the app acts for
                  maxLength: 64
                  type: string
                email:
                  maxLength: 254
                  minLength: 1
                  type: string
                roles:
                  items:
                    maxLength: 100
                    minLength: 1
