  /v1/files/content:
    delete:
      description: Delete a file and its record
      operationId: deleteFile
      parameters:
        - $ref: '#/components/parameters/FileUrl'
      responses:
        "204":
          description: Deleted
        default:
          $ref: '#/components/responses/Problem'
      summary: Delete a file and its record
      tags:
        - files
        - Files
        - Web
    get:
      description: A file's bytes
      operationId: readFile
      parameters:
        - $ref: '#/components/parameters/FileUrl'
      responses:
        "200":
          content:
            '*/*':
              schema:
                format: binary
                type: string
          description: The file, with its own media type as Content-Type
          headers:
            X-File-Name:
              description: The file's display name, percent-encoded
              schema:
                type: string
            X-File-Public:
              description: Whether the file is in a public folder
              schema:
                type: boolean
        default:
          $ref: '#/components/responses/Problem'
      summary: A file's bytes
      tags:
        - files
        - Files
        - Web
    put:
      description: |
        Give either `fileUrl` (a chosen address; the bytes must match its type) or `folder` and `namePrefix` (the
        address is generated from the type detected in the bytes and returned).
      operationId: storeFile
      parameters:
        - in: query
          name: fileUrl
          required: false
          schema:
            maxLength: 300
            type: string
        - in: query
          name: folder
          required: false
          schema:
            maxLength: 40
            type: string
        - in: query
          name: namePrefix
          required: false
          schema:
            pattern: ^[a-z0-9_]{1,40}$
            type: string
        - in: query
          name: ownerId
          required: false
          schema:
            maxLength: 64
            type: string
        - in: query
          name: fileName
          required: false
          schema:
            maxLength: 200
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: true
      responses:
        "201":
          $ref: '#/components/responses/File'
        default:
          $ref: '#/components/responses/Problem'
      summary: Store a file the platform keeps (seed data, generated documents, website visitors' attachments)
      tags:
        - files
        - Files
        - Web
  /v1/files/records:
    get:
      description: Records of the given files (missing ones are left out)
      operationId: lookupFiles
      parameters:
        - explode: true
          in: query
          name: fileUrl
          required: true
          schema:
            items:
              type: string
            minItems: 1
            type: array
          style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/File'
                    type: array
                required:
                  - items
                type: object
          description: The records found
        default:
          $ref: '#/components/responses/Problem'
      summary: Records of the given files (missing ones are left out)
      tags:
        - files
        - Files
        - Web
